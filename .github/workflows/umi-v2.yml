name: UMI v2
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
    branches: [unified-model-interface-v2]
  push:
    branches: [unified-model-interface-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coordinated:
    name: UMI v2
    # The unified release branch supplies the runner and the lock of the peers
    # (install/peer-revisions.json). A pull request body can name partner pull
    # requests in a "Candidate set:" line (see unified install/README.md).
    uses: KartikP/brainscore-unified/.github/workflows/offline-tests.yml@unified-model-interface-v2
    with:
      candidate: vision
      candidate_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      candidate_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      unified_revision: unified-model-interface-v2
