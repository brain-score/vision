schema_version: "2.0.0"
schema_url: "https://raw.githubusercontent.com/brain-score/vision/master/docs/model_metadata/model-metadata-v2.schema.json"
model:
  identifier: "AdvProp_efficientnet-b2"
  display_name: "AdvProp_efficientnet-b2"
  domain: "vision"
  version: "B2 Scale Variant"
architecture:
  family: "convolutional_neural_network"
  description: "Convolutional Neural Network"
  parameter_count:
    value: 9200000
    exact: true
  trainable_layers:
    description: "7?"
  recurrent: false
lineage:
  base_models:
    -
      name: "AdvProp EfficientNet"
interface:
  inputs:
    -
      modality: "image"
      shape:
        channels: 3
        height: 260
        width: 260
  description: "RGB image 260x260x3 NCHW, 1000-class logits"
preprocessing:
  description: "Resize to 260×260, standard ImageNet mean/std normalization"
training:
  datasets:
    -
      identifier: "imagenet-1k"
      name: "ImageNet-1k"
      role: "training"
      sample_count: 1281167
      sample_unit: "images"
  supervision:
    type: "supervised"
    description: "Fully supervised"
  objectives:
    -
      type: "classification"
      description: "1,000-class image classification"
  loss:
    description: "Cross-Entropy Loss"
evaluation:
  test_datasets:
    -
      description: "ImageNet-1K, ImageNet-C, ImageNet-A, Stylized-ImageNet"
  validation_datasets:
    -
      description: "ImageNet-1K, ImageNet-C, ImageNet-A, Stylized-ImageNet"
artifacts:
  -
    role: "weights"
    provider: "Google"
    identifier: "tf_efficientnet_b2.ap_in1k"
  -
    role: "source_code"
    provider: "Brain-Score"
    url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/AdvProp_efficientnet_b2"
    path: "brainscore_vision/models/AdvProp_efficientnet_b2"
intended_use:
  applications:
    - "Image Classification"
  users:
    - "CV practitioners needing robustness-aware pretrained backbones"
    - "researchers studying adversarial training as a regularizer rather than a defense"
  limitations:
    - "Adds training-time compute overhead (adversarial example generation + auxiliary BN)"
    - "benefits scale with model size — smaller models like B2 see less improvement than B7/B8"
    - "robustness gains are to common corruptions, not necessarily to adaptive/white-box adversarial attacks"
  biases:
    - "Inherits standard ImageNet dataset biases"
authorship:
  creators:
    - "Cihang Xie, Mingxing Tan, Boqing Gong, Jiang Wang, Alan Yuille, Quoc V. Le"
  organizations:
    - "Google, Johns Hopkins University"
licenses:
  -
    scope: "unspecified"
    name: "Apache 2.0"
    spdx: "Apache-2.0"
