schema_version: "2.0.0"
schema_url: "https://raw.githubusercontent.com/brain-score/vision/master/docs/model_metadata/model-metadata-v2.schema.json"
model:
  identifier: "AdvProp_efficientnet-b4"
  display_name: "AdvProp_efficientnet-b4"
  domain: "vision"
  version: "B4 Scale Variant"
architecture:
  family: "convolutional_neural_network"
  description: "Convolutional Neural Network"
  parameter_count:
    value: 19300000
    exact: true
  trainable_layers:
    count: 31
  recurrent: false
lineage:
  base_models:
    -
      name: "AdvProp EfficientNet"
interface:
  inputs:
    -
      modality: "image"
      shape:
        channels: 3
        height: 380
        width: 380
  description: "RGC image 380x380x3 NCHW, 1000-class logits"
preprocessing:
  description: "Resize to 380×380, standard ImageNet normalization"
training:
  datasets:
    -
      identifier: "imagenet-1k"
      name: "ImageNet-1k"
      role: "training"
      sample_count: 1281167
      sample_unit: "images"
  supervision:
    type: "supervised"
    description: "Fully Supervised"
  objectives:
    -
      type: "classification"
      description: "1,000-class image classification"
  loss:
    description: "Cross-entropy loss"
evaluation:
  test_datasets:
    -
      description: "ImageNet-1K, ImageNet-C, ImageNet-A, Stylized-ImageNet"
  validation_datasets:
    -
      description: "ImageNet-1K, ImageNet-C, ImageNet-A, Stylized-ImageNet"
artifacts:
  -
    role: "weights"
    provider: "Google"
    identifier: "tf_efficientnet_b4.ap_in1k"
  -
    role: "source_code"
    provider: "Brain-Score"
    url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/AdvProp_efficientnet_b4"
    path: "brainscore_vision/models/AdvProp_efficientnet_b4"
intended_use:
  applications:
    - "Image Classification needing a mid-to-large robust backbone"
  users:
    - "CV practitioners needing a mid-to-large robust backbone"
    - "researchers studying adversarial training as regularization"
  limitations:
    - "Training overhead from adversarial example generation + auxiliary BN"
    - "AdvProp's benefit scales with model size, so B4 likely sees a smaller boost than B7/B8"
    - "robustness gains target common corruptions, not adaptive/white-box attacks"
  biases:
    - "Inherits standard ImageNet dataset biases"
authorship:
  creators:
    - "Cihang Xie, Mingxing Tan, Boqing Gong, Jiang Wang, Alan Yuille, Quoc V. Le"
  organizations:
    - "Google, Johns Hopkins University"
licenses:
  -
    scope: "unspecified"
    name: "Apache 2.0"
    spdx: "Apache-2.0"
provenance:
  sources:
    curation_workbook:
      type: "curation"
      title: "Brainscore Model Metadata.xlsx"
    implementation:
      type: "source_code"
      url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/AdvProp_efficientnet_b4"
      path: "brainscore_vision/models/AdvProp_efficientnet_b4"
