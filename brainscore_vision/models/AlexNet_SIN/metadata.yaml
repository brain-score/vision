        name: ImageNet validation set, stylized ImageNet validation set
        description: null
    use:
      applications:
      - Studying/reducing texture bias in CNNs
      - shape-bias research
      - robustness-to-corruption research
      - not recommended as a general-purpose high-accuracy classifier, given the authors'
        own accuracy caveat
      biases:
      - This model exists specifically to study/reduce texture bias — but even after
        SIN training, AlexNet's shape bias improvement was modest compared to ResNet-50-SIN
        (81% shape bias), suggesting AlexNet's shallow/simple architecture may limit
        how much shape bias can be induced via data alone. Also inherits standard
        ImageNet dataset biases (geographic/cultural skew, label noise)
      limitations:
      - 'Explicitly authors-stated: suboptimal hyperparameters led to below-standard
        accuracy'
      - AlexNet's measured shape bias after SIN training was notably lower than ResNet-50-SIN's
        (42.9% texture / lower shape bias for AlexNet on cue-conflict stimuli, and
        a follow-up torchvision-based re-evaluation found AlexNet's shape bias at
        25.3%, lower than originally reported figures) — indicating AlexNet benefits
        less from SIN training than deeper architectures like ResNet-50
      users:
      - Vision science / cognitive science researchers studying human-vs-CNN perception
      - robustness researchers
      - NOT recommended for production classification use
    people:
      creators:
      - Robert Geirhos, Patricia Rubisch, Claudio Michaelis, Matthias Bethge, Felix
        A. Wichmann, Wieland Brendel
      organizations:
