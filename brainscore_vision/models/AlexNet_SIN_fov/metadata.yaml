      - Robert Geirhos
      - Patricia Rubisch
      - Claudio Michaelis
      - Matthias Bethge
      - Felix A. Wichmann
      - Wieland Brendel
      organizations:
      - University of Tübingen
    lineage:
      base_models:
      - identifier: AlexNet_SIN
        name: AlexNet_SIN
        relationship: variant_of
