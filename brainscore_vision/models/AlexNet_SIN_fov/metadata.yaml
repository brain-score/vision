      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/AlexNet_SIN_fov
        citation: Brain-Score vision plugin code, brainscore_vision/models/AlexNet_SIN_fov
      geirhos2019:
        kind: paper
        url: https://arxiv.org/abs/1811.12231
        citation: Geirhos et al. (2019), ImageNet-trained CNNs are biased towards
          texture; increasing shape bias improves accuracy and robustness, ICLR 2019
    model:
      display_name: AlexNet_SIN_fov4
      version: alexnet_train_60_epochs_lr0.001 (Stylized-ImageNet); evaluated with
        4 visual degrees
      architecture:
        family: convolutional_neural_network
        description: AlexNet (torchvision definition)
      parameter_count: 61100840
      parameter_count_exact: true
      trainable_layers: '8'
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: 1000-class classification on Stylized-ImageNet
    training:
      process: Trained on Stylized-ImageNet for 60 epochs with learning rate 0.001
        (released texture-vs-shape checkpoint)
    data:
      summary: Stylized-ImageNet
      training_datasets:
      - identifier: stylized-imagenet
        name: Stylized-ImageNet
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: Robert Geirhos / Bethge lab (bitbucket texture-vs-shape-pretrained-models)
      checkpoint: https://bitbucket.org/robert_geirhos/texture-vs-shape-pretrained-models/raw/0008049cd10f74a944c6d5e90d4639927f8620ae/alexnet_train_60_epochs_lr0.001-b4aa5238.pth.tar
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/AlexNet_SIN_fov
    people:
