schema_version: '2.0'
domain: vision
models:
  ReAlnet01_ALL:
    sources:
      legacy:
        kind: unreviewed
        citation: Existing plugin metadata; primary sources need review.
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/ReAlnet_ALL
        citation: Brain-Score vision plugin code, brainscore_vision/models/ReAlnet_ALL
      lu2024:
        kind: paper
        url: https://arxiv.org/abs/2401.17231
        citation: Lu, Wang & Golomb (2024), Achieving more human brain-like vision
          via human EEG representational alignment (ReAlnet), arXiv:2401.17231
    model:
      display_name: ReAlnet01_ALL
      version: Subject 01 checkpoint; the meaning of the "ALL" suffix is not documented
      architecture:
        family: recurrent_convolutional_neural_network
        description: CORnet-S (recurrent V1/V2/V4/IT areas with skip connections)
          whose weights come from a ReAlnet encoder; the EEG encoding head is dropped
          at inference; recurrent time steps are mapped to time bins (CORnet commitment)
      parameter_count: 53416616
      parameter_count_exact: true
      trainable_layers: '18'
      recurrent: true
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised_neural_alignment
        description: ImageNet-pretrained CORnet-S fine-tuned to also predict one human
          subject's EEG responses to natural images
    training:
      process: Per-subject ReAlnet-style CORnet-S checkpoint for subject 01 (loaded
        without the encoder fc layers); how it differs from the base ReAlnet release
        is not documented
    data:
      summary: ImageNet-1k (CORnet-S pretraining); THINGS EEG2 subject 1 (alignment)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: pretraining
      - identifier: things-eeg2
        name: THINGS EEG2
        description: EEG of subject 1 viewing THINGS training images
        role: fine_tuning
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits (CORnet-S decoder)
    provenance:
      weights_provider: Brain-Score submitter upload (user_488)
      checkpoint: s3://brainscore-storage/brainscore-vision/models/user_488/sub-01.pt
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/ReAlnet_ALL
    people:
      creators:
      - Zitong Lu
      - Yile Wang
      - Julie D. Golomb
      organizations:
      - The Ohio State University
    use:
      applications:
      - Studying human brain-aligned visual representations
    lineage:
      base_models:
      - identifier: CORnet-S
        name: CORnet-S
        relationship: fine_tuned_from
    assertions:
    - path: /model/display_name
      status: probable
      sources:
      - plugin_code
    - path: /model/version
      status: probable
      sources:
      - plugin_code
