    model:
      display_name: ReAlnet06_ALL
      version: Subject 06 checkpoint; the meaning of the "ALL" suffix is not documented
      architecture:
        family: recurrent_convolutional_neural_network
        description: CORnet-S (recurrent V1/V2/V4/IT areas with skip connections)
          whose weights come from a ReAlnet encoder; the EEG encoding head is dropped
          at inference; recurrent time steps are mapped to time bins (CORnet commitment)
      parameter_count: 53416616
      parameter_count_exact: true
      trainable_layers: '18'
      recurrent: true
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised_neural_alignment
        description: ImageNet-pretrained CORnet-S fine-tuned to also predict one human
          subject's EEG responses to natural images
    training:
      process: Per-subject ReAlnet-style CORnet-S checkpoint for subject 06 (loaded
        without the encoder fc layers); how it differs from the base ReAlnet release
        is not documented
    data:
      summary: ImageNet-1k (CORnet-S pretraining); THINGS EEG2 subject 6 (alignment)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: pretraining
      - identifier: things-eeg2
        name: THINGS EEG2
        description: EEG of subject 6 viewing THINGS training images
        role: fine_tuning
