    model:
      display_name: ReAlnet01_cornet
      version: Base subject-1 EEG-aligned model, default visual_degrees=8 (per sibling
        fov4/12/16 registration code)
      architecture:
        family: recurrent_convolutional_neural_network
        description: CNN+RNN hybrid (CORnet-S), recurrent with skip connections, EEG-aligned,
          default field of view
      parameter_count: 53416616
      parameter_count_exact: true
      trainable_layers: 18 trainable layers (per metadata) out of 72 total - CORnet-S
        reuses weights across recurrent time steps
      recurrent: true
      input_resolution:
        channels: 3
        height: 224
        width: 224
      visual_degrees: 8.0
      visual_degrees_description: visual_degrees=8 (default; explicit sibling entries
        confirm base uses 8 while fov4/12/16 override it)
      supervision:
        type: supervised_neural_alignment
        description: Supervised + neural-alignment supervision
    training:
      process: CORnet-S fine-tuned via joint classification + EEG-encoding loss for
        subject 1, default visual_degrees=8, using CORnetCommitment with time_mapping
        for recurrent-timestep alignment
      objective: Joint classification + EEG-encoding loss
      loss: Cross-entropy + EEG-encoding alignment loss
      learning_rate: null
      batch_size: null
      preprocessing: null
    data:
      summary: ImageNet-1k (CORnet-S base) + THINGS EEG2 human EEG data (subject 1)
      training_datasets:
      - identifier: imagenet-1k-cornet-s-base-things-eeg
        name: ImageNet-1k (CORnet-S base) + THINGS EEG2 human EEG data (subject 1)
        description: null
        role: training
    io:
