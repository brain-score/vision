    model:
      display_name: ReAlnet01_cornet_fov4
      version: Derivative of ReAlnet01_cornet (subject 1), registered at visual_degrees=4
        instead of default 8
      architecture:
        family: recurrent_convolutional_neural_network
        description: CNN+RNN hybrid (CORnet-S), recurrent with skip connections, EEG-aligned,
          narrow field of view
      parameter_count: 53416616
      parameter_count_exact: true
      trainable_layers: Same weights as ReAlnet01_cornet (18 trainable per metadata);
        only the visual-degrees commitment differs, not the weights
      recurrent: true
      input_resolution:
        channels: 3
        height: 224
        width: 224
      visual_degrees: 4.0
      visual_degrees_description: visual_degrees=4 (explicit, confirmed via __init__.py)
      supervision:
        type: other
        description: Same as ReAlnet01_cornet
    training:
      process: Subject-1 EEG-aligned CORnet-S (as in ReAlnet01_cornet), re-registered
        with visual_degrees=4 (narrower field of view) via CORnetCommitment
      objective: Same as ReAlnet01_cornet
      loss: Same as ReAlnet01_cornet
      learning_rate: Same as ReAlnet01_cornet
      batch_size: Same as ReAlnet01_cornet
      preprocessing: Same as ReAlnet01_cornet
    data:
      summary: Same as ReAlnet01_cornet - ImageNet-1k + THINGS EEG2 (subject 1)
      training_datasets:
      - identifier: same-as-realnet01-cornet-imagenet-1k
        name: Same as ReAlnet01_cornet - ImageNet-1k + THINGS EEG2 (subject 1)
        description: null
        role: training
    io:
      modality: image
      interface: Same mechanism as ReAlnet01_cornet, narrower field of view
      input_format: Same mechanism as ReAlnet01_cornet
      output_format: narrower field of view
      tokenizer: null
    provenance:
      weights_provider: Same as ReAlnet01_cornet
      checkpoint: Same weights as ReAlnet01_cornet, different visual_degrees registration
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/ReAlnet_cornet_fov
      curation_confidence: high
    legal:
      license: Same as ReAlnet01_cornet
    eval:
      test_datasets:
      - identifier: brain-score-neural-behavioral-benchmark
        name: Brain-Score neural/behavioral benchmark stimulus sets (confirmed via
          ModelCommitment/metadata registration)
        description: null
      validation_datasets:
      - identifier: same-as-realnet01-cornet
        name: Same as ReAlnet01_cornet
        description: null
    use:
      applications:
      - Field-of-view sensitivity analysis for neuro-aligned models
      biases:
      - Same individual-subject bias caveat
      limitations:
      - Narrower field of view may reduce contextual information reaching the model
      users:
      - Vision neuroscientists studying field-of-view effects
    people:
      creators:
      - Lu et al. 2024 (fov-variant adaptation)
      organizations:
      - Same as ReAlnet01_cornet
    lineage:
      base_models:
      - identifier: CORnet-S
        name: CORnet-S
        relationship: variant_of
    legacy:
      architecture: DCNN, RNN, SKIP_CONNECTIONS
      model_family: cornet
      total_parameter_count: 53416616
      trainable_parameter_count: 53416616
      total_layers: 72
      trainable_layers: 18
      model_size_mb: 213.67
      training_dataset: null
      task_specialization: null
      brainscore_link: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/ReAlnet_cornet_fov
      huggingface_link: null
      extra_notes: null
      runnable: true
  ReAlnet01_cornet_fov12:
    sources:
      legacy:
        kind: unreviewed
        citation: Existing plugin metadata; primary sources need review.
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/ReAlnet_cornet_fov
        citation: Brain-Score vision plugin code, brainscore_vision/models/ReAlnet_cornet_fov
      lu2024:
        kind: paper
        url: https://arxiv.org/abs/2401.17231
        citation: Lu, Wang & Golomb (2024), Achieving more human brain-like vision
          via human EEG representational alignment (ReAlnet), arXiv:2401.17231
    model:
      display_name: ReAlnet01_cornet_fov12
      version: ReAlnet subject 01, evaluated with 12 visual degrees
      architecture:
        family: recurrent_convolutional_neural_network
        description: CORnet-S (recurrent V1/V2/V4/IT areas with skip connections)
          whose weights come from a ReAlnet encoder; the EEG encoding head is dropped
          at inference; recurrent time steps are mapped to time bins (CORnet commitment)
      parameter_count: 53416616
      parameter_count_exact: true
      trainable_layers: '18'
      recurrent: true
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised_neural_alignment
        description: ImageNet-pretrained CORnet-S fine-tuned to also predict one human
          subject's EEG responses to natural images
    training:
      process: ImageNet-pretrained CORnet-S extended with a multi-layer encoding module
        (V1, V2, V4 and IT features -> 340 EEG outputs) and fine-tuned on the EEG
        of subject 1 viewing THINGS EEG2 training images, keeping its classification
        output
      objective: Joint object classification and EEG encoding (representational alignment)
    data:
      summary: ImageNet-1k (CORnet-S pretraining); THINGS EEG2 subject 1 (alignment)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: pretraining
      - identifier: things-eeg2
        name: THINGS EEG2
        description: EEG of subject 1 viewing THINGS training images
        role: fine_tuning
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits (CORnet-S decoder)
    provenance:
      weights_provider: Lu et al. (ReAlnet release, on Brain-Score S3)
      checkpoint: s3://brainscore-storage/brainscore-vision/models/ReAlnet/ReAlnet01_best_model_params.pt
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/ReAlnet_cornet_fov
    people:
      creators:
      - Zitong Lu
      - Yile Wang
      - Julie D. Golomb
      organizations:
      - The Ohio State University
    use:
      applications:
      - Studying human brain-aligned visual representations
    lineage:
      base_models:
      - identifier: CORnet-S
        name: CORnet-S
        relationship: fine_tuned_from
