    model:
      display_name: VOneCORnet-S
      version: v0.1 weights release
      architecture:
        family: hybrid_biological_convolutional
        description: V1 front-end + recurrent CNN (CORnet-S) back-end
      parameter_count: 53000000
      parameter_count_exact: false
      trainable_layers: All CORnet-S recurrent block layers trainable; VOneBlock fixed
      recurrent: true
      input_resolution:
        channels: 3
        height: 224
        width: 224
      visual_degrees: 8.0
      visual_degrees_description: 8 degrees (VOneNet family default convention)
      supervision:
        type: supervised
        description: Fully supervised (1000-way classification)
    training:
      process: Gabor front-end -> bottleneck -> CORnet-S recurrent V1/V2/V4/IT-like
        block stack, unrolled over time steps
      objective: Cross-entropy classification loss on ImageNet labels
      loss: Cross-entropy
      learning_rate: null
      batch_size: null
      preprocessing: Normalize mean=[0.5,0.5,0.5], std=[0.5,0.5,0.5]
    data:
      summary: ImageNet (ILSVRC2012)
      training_datasets:
      - identifier: imagenet-ilsvrc2012
        name: ImageNet (ILSVRC2012)
        description: 1K
        role: training
    io:
      modality: image
      interface: RGB tensor 3x224x224 -> 1000-class logits or intermediate activations
      input_format: RGB tensor 3x224x224
      output_format: 1000-class logits or intermediate activations
      tokenizer: null
    provenance:
      weights_provider: DiCarlo Lab; file vonecornets_e70.pth.tar
      checkpoint: vonecornets_e70.pth.tar
      source_url: null
      curation_confidence: null
    legal:
      license: GNU GPL v3+
    eval:
      test_datasets:
      - identifier: imagenet-val-50k-brain-score-benchma
        name: ImageNet val (50K) + Brain-Score benchmark stimulus sets
        description: null
      validation_datasets:
      - identifier: imagenet-1k-standard-validation-split
        name: ImageNet-1K standard validation split
        description: null
    use:
      applications:
      - Same, plus studying recurrent computation's role in robustness/behavior
      biases:
      - Inherits ImageNet dataset biases
      limitations:
      - Heavier compute from recurrent unrolling
      - weaker raw ImageNet top-1 than transformers
      users:
      - Vision neuroscientists, ML robustness researchers
    people:
      creators:
      - Dapello, Marques, Schrimpf, Geiger, Cox, DiCarlo
      organizations:
      - MIT DiCarlo Lab
    lineage:
      base_models:
      - identifier: CORnet-S
        name: CORnet-S
        relationship: variant_of
    legacy:
      total_parameter_count: 53000000
      runnable: true
