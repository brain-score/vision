schema_version: "2.0.0"
schema_url: "https://raw.githubusercontent.com/brain-score/vision/master/docs/model_metadata/model-metadata-v2.schema.json"
model:
  identifier: "VOneCORnet-S"
  display_name: "VOneCORnet-S"
  domain: "vision"
  version: "v0.1 weights release"
architecture:
  family: "hybrid_biological_convolutional"
  description: "V1 front-end + recurrent CNN (CORnet-S) back-end"
  parameter_count:
    value: 53000000
    exact: false
  trainable_layers:
    description: "All CORnet-S recurrent block layers trainable; VOneBlock fixed"
lineage:
  base_models:
    -
      identifier: "CORnet-S"
      name: "CORnet-S"
      relationship: "derived_from"
interface:
  inputs:
    -
      modality: "image"
      shape:
        channels: 3
        height: 224
        width: 224
  description: "RGB tensor 3x224x224 -> 1000-class logits or intermediate activations"
  visual_degrees: 8.0
  visual_degrees_description: "8 degrees (VOneNet family default convention)"
preprocessing:
  description: "Normalize mean=[0.5,0.5,0.5], std=[0.5,0.5,0.5]"
training:
  process: "Gabor front-end -> bottleneck -> CORnet-S recurrent V1/V2/V4/IT-like block stack, unrolled over time steps"
  datasets:
    -
      identifier: "imagenet-1k"
      name: "ImageNet-1k"
      role: "training"
  dataset_summary: "~1.28M train / 50K val images (ImageNet-1K)"
  supervision:
    type: "supervised"
    description: "Fully supervised (1000-way classification)"
  objectives:
    -
      type: "classification"
      description: "Cross-entropy classification loss on ImageNet labels"
  hyperparameters:
    learning_rate:
      description: "Not publicly specified"
    batch_size:
      description: "Not publicly specified"
  loss:
    description: "Cross-entropy"
evaluation:
  test_datasets:
    -
      description: "ImageNet val (50K) + Brain-Score benchmark stimulus sets"
  validation_datasets:
    -
      description: "ImageNet-1K standard validation split"
artifacts:
  -
    role: "weights"
    provider: "DiCarlo Lab; file vonecornets_e70.pth.tar"
    identifier: "vonecornets_e70.pth.tar"
  -
    role: "source_code"
    provider: "Brain-Score"
    url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/VOneCORnet_S"
    path: "brainscore_vision/models/VOneCORnet_S"
intended_use:
  applications:
    - "Same, plus studying recurrent computation's role in robustness/behavior"
  users:
    - "Vision neuroscientists, ML robustness researchers"
  limitations:
    - "Heavier compute from recurrent unrolling"
    - "weaker raw ImageNet top-1 than transformers"
  biases:
    - "Inherits ImageNet dataset biases"
authorship:
  creators:
    - "Dapello, Marques, Schrimpf, Geiger, Cox, DiCarlo"
  organizations:
    - "MIT DiCarlo Lab"
licenses:
  -
    scope: "unspecified"
    name: "GNU GPL v3+"
provenance:
  sources:
    curation_workbook:
      type: "curation"
      title: "Brainscore Model Metadata.xlsx"
    implementation:
      type: "source_code"
      url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/VOneCORnet_S"
      path: "brainscore_vision/models/VOneCORnet_S"
  assertions:
    -
      path: "/model/display_name"
      status: "verified"
      source: "curation_workbook"
    -
      path: "/lineage/base_models"
      status: "verified"
      source: "curation_workbook"
