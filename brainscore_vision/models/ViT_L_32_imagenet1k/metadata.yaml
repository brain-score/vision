        name: ImageNet-1k validation set (same split used for val/test)
        description: null
    use:
      applications:
      - General image classification
      - transfer-learning backbone for downstream CV tasks
      biases:
      - Inherits generic ImageNet-1k dataset biases (geographic/demographic skew
      - label noise)
      - not specifically documented per-checkpoint
      limitations:
      - Lower accuracy (76.97% top-1) vs same-size ViT pretrained on ImageNet-21k
        or SWAG
      - data-hungry/overfitting-prone when trained from scratch on IN-1k alone
      users:
      - ML researchers/engineers in the PyTorch ecosystem needing an off-the-shelf
        ViT classifier
    people:
      creators:
      - PyTorch Vision team (Meta AI / PyTorch Foundation contributors)
      organizations:
      - PyTorch (Linux Foundation), formerly Meta AI
