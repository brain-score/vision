schema_version: '2.0'
domain: vision
models:
  Zejin_Lu_dvd_baseline_imagenet_resnet50:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/Zejin_Lu_dvd_baseline_imagenet_resnet50
        citation: Brain-Score vision plugin code, brainscore_vision/models/Zejin_Lu_dvd_baseline_imagenet_resnet50
      lu2025:
        kind: paper
        url: https://arxiv.org/abs/2507.03168
        citation: Lu, Thorat, Cichy & Kietzmann (2025), Adopting a human developmental
          visual diet yields robust, shape-based AI vision, arXiv:2507.03168
    model:
      display_name: Zejin_Lu_dvd_baseline_imagenet_resnet50
      version: Checkpoint file dvd_baseline_checkpoint_best.pth
      architecture:
        family: convolutional_neural_network
        description: ResNet-50 (torchvision resnet50 definition, 1000-way fc head),
          weights loaded with strict=True
      parameter_count: 25557032
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
    training:
      process: Baseline ResNet-50 of the developmental visual diet (DVD) comparison.
        Plugin name indicates ImageNet training; best checkpoint (checkpoint_best.pth).
    data:
      summary: ImageNet (from the plugin name)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224, scaled to [0, 1]; no mean/std normalization
      output_format: 1000-way logits from the fc layer
    provenance:
      weights_provider: Brain-Score submitter upload to the Brain-Score S3 bucket
        (user_784)
      checkpoint: s3://brainscore-storage/brainscore-vision/models/user_784/dvd_baseline_checkpoint_best.pth
        (version 60x_AyvgeCC1dLaX_rwchzWLwQeE4vlc)
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/Zejin_Lu_dvd_baseline_imagenet_resnet50
    people:
      creators:
      - Zejin Lu
      - Sushrut Thorat
      - Radoslaw M. Cichy
      - Tim C. Kietzmann
    use:
      applications:
      - Modeling the development of robust, shape-based human vision
    lineage:
      base_models:
      - name: ResNet-50
        relationship: variant_of
    assertions:
