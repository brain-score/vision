schema_version: '2.0'
domain: vision
models:
  alexnet_altahan_baseline:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/alexnet_altahan_baseline
        citation: Brain-Score vision plugin code, brainscore_vision/models/alexnet_altahan_baseline
    model:
      display_name: alexnet_altahan_baseline
      architecture:
        family: convolutional_neural_network
        description: 'AlexNet (torchvision definition): AlexNet fine-tuned on ImageNet
          with no other change.'
      parameter_count: 61100840
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: Supervised ImageNet-1k classification
    training:
      process: torchvision AlexNet fine-tuned on ImageNet-1k (SGD, lr 1e-3, momentum
        0.9, weight decay 5e-4, batch 256, random-resized-crop + flip; 5.12M images),
        with Brain-Score's committed 'alexnet' layer map and readout.
    data:
      summary: ImageNet-1k (ILSVRC-2012) -> ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: pretraining
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: fine_tuning
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: Brain-Score submitter upload (user_873)
      checkpoint: s3://brainscore-storage/brainscore-vision/models/user_873/alexnet_altahan_baseline.pt
        (version iuHO0N19w8EgpN5dOiLQUg.uacEXckub)
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/alexnet_altahan_baseline
    assertions:
