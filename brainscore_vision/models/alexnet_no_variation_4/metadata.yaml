schema_version: '2.0'
domain: vision
models:
  alexnet_no_variation_iteration=4:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/alexnet_no_variation_4
        citation: Brain-Score vision plugin code, brainscore_vision/models/alexnet_no_variation_4
      kapoor2025:
        kind: other
        url: https://iclr.cc/media/iclr-2025/Slides/36853_r86bRFq.pdf
        citation: 'Kapoor & Egger (2025), ICLR 2025 workshop slides: controlled synthetic
          training data (Blender renders of ~37K object meshes, one appearance or
          rotation factor varied per dataset), alignment evaluated with Brain-Score,
          RSA and CKA'
    model:
      display_name: alexnet_no_variation_iteration=4
      version: Dataset condition "no_variation", iteration 4
      architecture:
        family: convolutional_neural_network
        description: AlexNet (torchvision alexnet definition via torch.hub, 1000-way
          classifier)
      parameter_count: 61100840
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
    training:
      process: Trained (PyTorch Lightning checkpoint) on a synthetic Blender-rendered
        object dataset, condition "no_variation" (no viewpoint variation (single fixed
        viewpoint)), iteration 4
    data:
      summary: Synthetic Blender renders of object meshes, condition "no_variation"
      training_datasets:
      - identifier: other
        name: Kapoor & Egger synthetic rendered objects (no_variation)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way logits from the final classifier layer
    provenance:
      weights_provider: Shreya Kapoor / Bernhard Egger (eggerbernhard.ch web server)
      checkpoint: https://eggerbernhard.ch/shreya/latest_alexnet/no_variation_4.ckpt
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/alexnet_no_variation_4
    people:
      creators:
      - Shreya Kapoor
      - Bernhard Egger
      organizations:
      - Friedrich-Alexander-Universität Erlangen-Nürnberg
    use:
      applications:
      - Studying how rendering factors of synthetic training data affect brain alignment
    lineage:
      base_models:
      - name: AlexNet
        relationship: variant_of
    assertions:
