schema_version: '2.0'
domain: vision
models:
  alexnet_pipeline_test_v1:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/alexnet_pipeline_test_v1
        citation: Brain-Score vision plugin code, brainscore_vision/models/alexnet_pipeline_test_v1
      krizhevsky2012:
        kind: paper
        citation: Krizhevsky, Sutskever & Hinton (2012), ImageNet Classification with
          Deep Convolutional Neural Networks, NeurIPS 2012
      torchvision:
        kind: other
        url: https://pytorch.org/vision/stable/models.html
        citation: torchvision model zoo documentation
    model:
      display_name: alexnet_pipeline_test_v1
      version: torchvision AlexNet IMAGENET1K_V1 (pretrained=True)
      architecture:
        family: convolutional_neural_network
        description: 'AlexNet (torchvision single-tower variant: 5 convolutional and
          3 fully connected layers)'
      parameter_count: 61100840
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: 1000-class ImageNet-1k classification
    training:
      process: Supervised ImageNet-1k training (torchvision reference weights); no
        further training in the plugin
    data:
      summary: ImageNet-1k
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: torchvision (PyTorch)
      checkpoint: torchvision alexnet IMAGENET1K_V1
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/alexnet_pipeline_test_v1
    legal:
      license: BSD-3-Clause
    people:
      creators:
      - Alex Krizhevsky
      - Ilya Sutskever
      - Geoffrey E. Hinton
    use:
      applications:
      - Re-submission of torchvision AlexNet, apparently to test the Brain-Score submission
        pipeline (per plugin name)
    lineage:
      base_models:
      - identifier: alexnet
        name: AlexNet
        relationship: variant_of
