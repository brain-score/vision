    model:
      display_name: alexnet_training_seed_03
      version: training seed 03 checkpoint as shipped (untrained random initialization)
      architecture:
        family: convolutional_neural_network
        description: 'AlexNetV2 (TF-slim alexnet_v2 layout) in PyTorch, not torchvision
          AlexNet: conv1 11x11 stride 4 (64), conv2 5x5 (192), conv3-conv5 3x3 (384,
          384, 256), ReLU, three 3x3 stride-2 max-pools, no local response normalization;
          fc6-fc8 are convolutions (5x5 to 4096, 1x1 to 4096, 1x1 to 1000) with dropout
          0.5.'
      parameter_count: 50303912
      parameter_count_exact: true
      trainable_layers: '8'
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      visual_degrees: null
      visual_degrees_description: null
      supervision:
        type: null
        description: 'Intended: supervised ImageNet classification, per the plugin
          citation (Mehrer 2020). The shipped weights received no training.'
    training:
      process: 'Not trained. The checkpoint the plugin loads (S3 brainscorevariability,
        models/model_weights/training_seed_03.pth, sha1 6c5a1fdadc70e5007c66866400bfcd7c17280fa8)
        matches PyTorch default initialization in every layer: all weights and biases
        lie within +/-1/sqrt(fan_in) and each weight std is within 1% of the uniform-init
        value (trained torchvision AlexNet exceeds the bound 7-89x). Issue #2459 found
        the same for seed 01 (chance ImageNet top-1). The identifier and the plugin
        citation (Mehrer 2020, Individual differences among deep neural network models)
        indicate the intended models are TF-slim alexnet_v2 networks trained from
        different random seeds; trained checkpoints are on OSF (osf.io/3xupm), and
        the plugin does not load them. Which OSF checkpoint corresponds to each seed
        number is undocumented.'
      objective: null
      loss: null
      learning_rate: null
      batch_size: null
      preprocessing: 'Brain-Score wrapper: resize to 224x224, then ImageNet mean/std
        normalization (load_preprocess_images). The original TF-slim networks expect
        inputs scaled to [-1, 1] (issue #2459).'
    data:
      summary: null
      training_datasets: []
    io:
      modality: image
      interface: image, classification_logits
      input_format: image
      output_format: classification_logits
      tokenizer: null
    provenance:
      weights_provider: 'Brain-Score S3 bucket brainscorevariability (added in vision
        PR #1761)'
      checkpoint: models/model_weights/training_seed_03.pth, sha1 6c5a1fdadc70e5007c66866400bfcd7c17280fa8
        (untrained random initialization)
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/alexnet_training_seed_03
      curation_confidence: null
    legal:
      license: null
    eval:
      test_datasets: []
      validation_datasets: []
    use:
      applications: []
      biases: []
      users: []
      limitations:
      - Weights are an untrained random initialization, so scores reflect the architecture,
        not a trained network
      - Not the trained Mehrer (2020) network that the identifier and citation imply
      - Preprocessing (ImageNet mean/std) differs from the original networks' [-1,
        1] inputs
    people:
      creators: []
      organizations: []
    lineage:
      base_models:
      - identifier: alexnet
        name: AlexNet
        relationship: variant_of
