schema_version: '2.0'
domain: vision
models:
  antialias-resnet152:
    sources:
      legacy:
        kind: unreviewed
        citation: Existing plugin metadata; primary sources need review.
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/antialias_resnet152
        citation: Brain-Score vision plugin code, brainscore_vision/models/antialias_resnet152
      antialias:
        kind: paper
        url: https://arxiv.org/abs/1904.11486
        citation: Zhang (2019), Making Convolutional Networks Shift-Invariant Again,
          ICML 2019
    model:
      display_name: Antialiased ResNet-152
      architecture:
        family: convolutional_neural_network
        description: ResNet-152 with anti-aliased (BlurPool) downsampling; blur filters
          are fixed buffers, so the parameter count equals the torchvision base model
      parameter_count: 60192808
      parameter_count_exact: true
      trainable_layers: '156'
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: 1000-class ImageNet-1k classification
    training:
      process: Supervised ImageNet-1k training with low-pass filtering before every
        strided downsampling
    data:
      summary: ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way logits
    provenance:
      weights_provider: antialiased-cnns package (Adobe Research)
      checkpoint: antialiased_cnns.resnet152(pretrained=True)
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/antialias_resnet152
    legal:
      license: CC-BY-NC-SA-4.0
    people:
      creators:
      - Richard Zhang
      organizations:
      - Adobe Research
    use:
      applications:
      - Image classification
      - Feature extraction / backbone for vision tasks
    lineage:
      base_models:
      - name: ResNet-152
        relationship: variant_of
