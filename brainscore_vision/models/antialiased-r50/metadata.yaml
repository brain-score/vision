    model:
      display_name: antialiased-r50
      version: V0.3
      architecture:
        family: convolutional_neural_network
        description: Convolutional Neural Network
      parameter_count: 25600000
      parameter_count_exact: true
      trainable_layers: null
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      visual_degrees: null
      visual_degrees_description: null
      supervision:
        type: supervised
        description: Fully supervised
    training:
      process: 'Baseline ResNet-50 modified by replacing stride-2 downsampling (max-pool,
        avg-pool, or strided conv) with a "MaxBlurPool"-style approach: evaluate at
        stride 1, then apply a low-pass blur filter before subsampling. As of Oct
        2020, the released weights are produced by fine-tuning from baseline ResNet-50
        weights rather than training from scratch, using the last 2/3 of a full training
        schedule with learning rate lowered 10x and 60 epochs'
      objective: 1,000-class image classification
      loss: Standard cross-entropy loss
      learning_rate: 'Fine-tuning run: lr = 0..01 for 60 epochs'
      batch_size: '256'
      preprocessing: Standard PyTorch ImageNet pipeline (resize/crop to 224×224, normalization);
        evaluation of shift-consistency uses two random 224×224 crops of the same
        image
    data:
      summary: ImageNet (ILSVRC 2012)
      training_datasets:
      - identifier: imagenet-ilsvrc-2012
        name: ImageNet (ILSVRC 2012)
        description: 1,281,167
        role: training
    io:
      modality: image
      interface: RGB 224x224x3, 1000-class softmax logits
      input_format: RGB 224x224x3, 1000-class softmax logits
      output_format: null
      tokenizer: null
    provenance:
      weights_provider: Adobe Inc./Richard Zhang
      checkpoint: resnet50_lpf4
      source_url: null
      curation_confidence: null
    legal:
      license: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
        (CC BY-NC-SA 4.0); code builds on BSD-licensed PyTorch/torchvision repos
    eval:
      test_datasets:
      - identifier: imagenet-ilsvrc-2012-validation-set
        name: ImageNet ILSVRC 2012 validation set
        description: null
      validation_datasets:
      - identifier: imagenet-ilsvrc-2012-validation-set
        name: ImageNet ILSVRC 2012 validation set
        description: null
    use:
      applications:
      - Backbone for downstream vision applications needing improved shift-invariance/robustness
        to small translations
      limitations:
      - Antialiasing adds extra compute/runtime overhead versus baseline (no extra
        parameters, but slower forward pass)
      users:
      - Computer vision researchers/engineers needing a more robust drop-in ResNet-50
        backbone
    people:
      creators:
      - Richard Zhang
      organizations:
      - Adobe Inc.
    lineage:
      base_models:
      - identifier: standard-torchvision-resnet-50
        name: Standard torchvision ResNet-50
        relationship: fine_tuned_from
    legacy:
      architecture: DCNN
      total_parameter_count: 25600000
      runnable: true
