schema_version: '2.0'
domain: vision
models:
  blt_vs:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/blt-vs
        citation: Brain-Score vision plugin code, brainscore_vision/models/blt-vs
    model:
      display_name: blt_vs
      architecture:
        family: recurrent_convolutional_neural_network
        description: 'BLT-VS: recurrent network with bottom-up, lateral and top-down
          connections across ventral-stream areas'
      recurrent: true
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: EcoSet classification (565 categories)
    training:
      process: Trained on EcoSet (565 categories, per num_classes and checkpoint)
    data:
      summary: EcoSet (565 basic-level categories)
      training_datasets:
      - identifier: other
        name: EcoSet (565 basic-level categories)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 565-way logits
    provenance:
      weights_provider: Zenodo record 14223659
      checkpoint: https://zenodo.org/records/14223659/files/blt_vs.zip
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/blt-vs
    assertions:
    - path: /model/display_name
      status: probable
      sources:
      - plugin_code
