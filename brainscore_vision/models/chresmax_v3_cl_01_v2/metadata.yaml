schema_version: '2.0'
domain: vision
models:
  chresmax_v3_cl_01_v2:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/chresmax_v3_cl_01_v2
        citation: Brain-Score vision plugin code, brainscore_vision/models/chresmax_v3_cl_01_v2
    model:
      display_name: chresmax_v3_cl_01_v2
      architecture:
        family: convolutional_neural_network
        description: 'CHRESMAX v3: HMAX-inspired multi-scale S/C architecture with
          residual connections and learned scale scoring'
      recurrent: false
      input_resolution:
        channels: 3
        height: 322
        width: 322
    training:
      process: Trained model_best checkpoint from Hugging Face (cmulliken); training
        data and recipe not documented
    io:
      modality: image
      input_format: RGB image resized to 322x322 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way logits
    provenance:
      weights_provider: Hugging Face Hub (cmulliken)
      checkpoint: https://huggingface.co/cmulliken/chresmax_test/resolve/main/model_best.pth.tar
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/chresmax_v3_cl_01_v2
