      - Hanzi Mao
      - Chao-Yuan Wu
      - Christoph Feichtenhofer
      - Trevor Darrell
      - Saining Xie
      organizations:
      - Facebook AI Research (Meta AI)
      - UC Berkeley
    use:
      applications:
      - Image classification
      - Backbone for downstream vision tasks
