schema_version: '2.0'
domain: vision
models:
  convnext_base_fb_in1k:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/convnext_base_fb_in1k
        citation: Brain-Score vision plugin code, brainscore_vision/models/convnext_base_fb_in1k
      convnext:
        kind: paper
        url: https://arxiv.org/abs/2201.03545
        citation: Liu, Mao, Wu, Feichtenhofer, Darrell & Xie (2022), A ConvNet for
          the 2020s, CVPR 2022
      timm_card:
        kind: huggingface
        url: https://huggingface.co/timm/convnext_base.fb_in1k
        citation: timm model card convnext_base.fb_in1k
    model:
      display_name: convnext_base_fb_in1k
      version: timm convnext_base.fb_in1k
      architecture:
        family: convolutional_neural_network
        description: convnext_base (timm)
      parameter_count: 88591464
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: Supervised ImageNet-1k classification
    training:
      process: Supervised training on ImageNet-1k (original Facebook weights)
    data:
      summary: ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: 'timm / Hugging Face Hub: Facebook AI Research (original weights,
        distributed by timm)'
      checkpoint: timm/convnext_base.fb_in1k
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/convnext_base_fb_in1k
    legal:
