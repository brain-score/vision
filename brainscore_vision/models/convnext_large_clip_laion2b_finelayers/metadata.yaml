schema_version: '2.0'
domain: vision
models:
  convnext_large_clip_laion2b_finelayers:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/convnext_large_clip_laion2b_finelayers
        citation: Brain-Score vision plugin code, brainscore_vision/models/convnext_large_clip_laion2b_finelayers
      convnext:
        kind: paper
        url: https://arxiv.org/abs/2201.03545
        citation: Liu, Mao, Wu, Feichtenhofer, Darrell & Xie (2022), A ConvNet for
          the 2020s, CVPR 2022
      clip:
        kind: paper
        url: https://arxiv.org/abs/2103.00020
        citation: Radford et al. (2021), Learning Transferable Visual Models From
          Natural Language Supervision, ICML 2021
      openclip:
        kind: paper
        url: https://arxiv.org/abs/2212.07143
        citation: Cherti et al. (2023), Reproducible scaling laws for contrastive
          language-image learning, CVPR 2023
      timm_card:
        kind: huggingface
        url: https://huggingface.co/timm/convnext_large_mlp.clip_laion2b_soup_ft_in12k_in1k_384
        citation: timm model card convnext_large_mlp.clip_laion2b_soup_ft_in12k_in1k_384
    model:
      display_name: convnext_large_clip_laion2b_finelayers
      version: timm convnext_large_mlp.clip_laion2b_soup_ft_in12k_in1k_384
      architecture:
        family: convolutional_neural_network
        description: convnext_large_mlp (timm)
      parameter_count: 200128168
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 384
        width: 384
      supervision:
        type: contrastive_pretrain_supervised_finetune
        description: CLIP image-text contrastive pretraining, then supervised fine-tuning
    training:
      process: OpenCLIP (LAION-2B) image tower pretrained with an image-text contrastive
        objective, then fine-tuned in timm on ImageNet-12k and then ImageNet-1k (the
        pretrained tower is a weight-averaged soup of CLIP runs)
    data:
      summary: LAION-2B-en -> ImageNet-12k (timm 11,821-class subset) -> ImageNet-1k
        (ILSVRC-2012)
      training_datasets:
      - identifier: laion-2b
        name: LAION-2B-en
        role: pretraining
      - identifier: imagenet-12k
        name: ImageNet-12k (timm 11,821-class subset)
        role: fine_tuning
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: fine_tuning
    io:
      modality: image
      input_format: RGB image resized to 384x384 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: 'timm / Hugging Face Hub: OpenCLIP (LAION-2B) pretraining;
        timm (Ross Wightman) fine-tuning'
      checkpoint: timm/convnext_large_mlp.clip_laion2b_soup_ft_in12k_in1k_384
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/convnext_large_clip_laion2b_finelayers
    legal:
      license: Apache-2.0
    people:
      creators:
      - Zhuang Liu
      - Hanzi Mao
      - Chao-Yuan Wu
      - Christoph Feichtenhofer
      - Trevor Darrell
      - Saining Xie
      organizations:
      - Facebook AI Research (Meta AI)
      - UC Berkeley
    use:
      applications:
      - Image classification
      - Backbone for downstream vision tasks
