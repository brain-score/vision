schema_version: '2.0'
domain: vision
models:
  convnext_large_in22k_supervised:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/convnext_large_in22k_supervised
        citation: Brain-Score vision plugin code, brainscore_vision/models/convnext_large_in22k_supervised
      convnext:
        kind: paper
        url: https://arxiv.org/abs/2201.03545
        citation: Liu, Mao, Wu, Feichtenhofer, Darrell & Xie (2022), A ConvNet for
          the 2020s, CVPR 2022
      timm_card:
        kind: huggingface
        url: https://huggingface.co/timm/convnext_large.fb_in22k_ft_in1k_384
        citation: timm model card convnext_large.fb_in22k_ft_in1k_384
    model:
      display_name: convnext_large_in22k_supervised
      version: timm convnext_large.fb_in22k_ft_in1k_384
      architecture:
        family: convolutional_neural_network
        description: convnext_large (timm)
      parameter_count: 197767336
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 384
        width: 384
      supervision:
        type: supervised
        description: Supervised ImageNet-22k pretraining, then ImageNet-1k fine-tuning
    training:
      process: Supervised pretraining on ImageNet-22k, then fine-tuning on ImageNet-1k
        (original Facebook weights)
    data:
      summary: ImageNet-21k (also called ImageNet-22k) -> ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-21k
        name: ImageNet-21k (also called ImageNet-22k)
        role: pretraining
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: fine_tuning
    io:
      modality: image
      input_format: RGB image resized to 384x384 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: 'timm / Hugging Face Hub: Facebook AI Research (original weights,
        distributed by timm)'
      checkpoint: timm/convnext_large.fb_in22k_ft_in1k_384
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/convnext_large_in22k_supervised
    legal:
      license: Apache-2.0
    people:
      creators:
      - Zhuang Liu
      - Hanzi Mao
      - Chao-Yuan Wu
      - Christoph Feichtenhofer
      - Trevor Darrell
      - Saining Xie
      organizations:
      - Facebook AI Research (Meta AI)
      - UC Berkeley
    use:
      applications:
      - Image classification
      - Backbone for downstream vision tasks
