schema_version: '2.0'
domain: vision
models:
  convnext_tiny_imagenet1k_GELU_PS:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/convnext_tiny_imagenet1k_GELU_PS
        citation: Brain-Score vision plugin code, brainscore_vision/models/convnext_tiny_imagenet1k_GELU_PS
      hand_repo:
        kind: other
        url: https://codeberg.org/mwspratling/HAND
        citation: mwspratling/HAND repository on Codeberg (checkpoints of the HAND
          experiments)
      convnext:
        kind: paper
        url: https://arxiv.org/abs/2201.03545
        citation: Liu et al. (2022), A ConvNet for the 2020s, CVPR 2022
    model:
      display_name: convnext_tiny_imagenet1k_GELU_PS
      version: Checkpoint ConvNeXt-tiny_ImageNet_None_None_None_GELU_Conv_LayerNorm_StridedConv_CELoss_None.pt
      architecture:
        family: convolutional_neural_network
        description: ConvNeXt-tiny re-implemented in the plugin with activation GELU,
          normalization LayerNorm, downsampling StridedConv
      parameter_count: 28589128
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: ImageNet-1k classification with CELoss loss
    training:
      process: 'Trained on ImageNet-1k (task tag "ImageNet"), augmentation: no extra
        augmentation tag; configuration taken from the checkpoint name ConvNeXt-tiny_ImageNet_None_None_None_GELU_Conv_LayerNorm_StridedConv_CELoss_None'
      loss: Cross-entropy (CELoss tag in the checkpoint name)
    data:
      summary: ImageNet-1k
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 256 px (short side), center-cropped to 224x224,
        scaled to [0, 1] without mean/std normalization
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: M. W. Spratling (codeberg.org/mwspratling/HAND)
      checkpoint: https://codeberg.org/mwspratling/HAND/raw/branch/main/ConvNeXt-tiny_ImageNet_None_None_None_GELU_Conv_LayerNorm_StridedConv_CELoss_None.pt
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/convnext_tiny_imagenet1k_GELU_PS
    people:
