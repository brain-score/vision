schema_version: "2.0.0"
schema_url: "https://raw.githubusercontent.com/brain-score/vision/master/docs/model_metadata/model-metadata-v2.schema.json"
model:
  identifier: "convnext_tiny_sup"
  display_name: "convnext_tiny_sup"
  domain: "vision"
architecture:
  family: "convolutional_neural_network"
  description: "ConvNeXt (pure CNN)"
  parameter_count:
    value: 28600000
    exact: true
  recurrent: false
lineage:
  base_models:
    -
      identifier: "convnext-tiny"
      name: "ConvNeXt-Tiny"
      relationship: "variant_of"
interface:
  inputs:
    -
      modality: "image"
      shape:
        channels: 3
        height: 224
        width: 224
  description: "Input: RGB image tensor (assumed 224x224x3); Output: 1000-class logits (assumed)"
training:
  process: "Presumed standard supervised ImageNet-1k training of ConvNeXt-Tiny (no CLIP/self-supervised pretraining)"
  datasets:
    -
      identifier: "imagenet-22k"
      name: "ImageNet-22k"
      role: "pretraining"
    -
      identifier: "imagenet-1k"
      name: "ImageNet-1k"
      role: "fine_tuning"
  supervision:
    type: "supervised"
    description: "Supervised"
  objectives:
    -
      type: "classification"
      description: "Image classification"
evaluation:
  test_datasets:
    -
      description: "ImageNet validation set (used in the source paper's evaluation)"
  validation_datasets:
    -
      description: "ImageNet-1k validation set"
artifacts:
  -
    role: "weights"
    provider: "Brain-Score model registry (loaded via BrainScore library v2.2.4)"
  -
    role: "source_code"
    provider: "Brain-Score"
    url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/convnext_tiny_sup"
    path: "brainscore_vision/models/convnext_tiny_sup"
intended_use:
  applications:
    - "Candidate model for measuring representational alignment to biological vision and adversarial robustness"
  users:
    - "Vision neuroscience / alignment researchers (via Brain-Score)"
provenance:
  sources:
    curation_workbook:
      type: "curation"
      title: "Brainscore Model Metadata.xlsx"
    implementation:
      type: "source_code"
      url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/convnext_tiny_sup"
      path: "brainscore_vision/models/convnext_tiny_sup"
