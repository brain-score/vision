schema_version: '2.0'
domain: vision
models:
  cvt_cvt-13-384-in22k_finetuned-in1k_4_LucyV4:
    model:
      display_name: CvT-13 / 384px / ImageNet-22k to 1k
      version: CvT-13 / 384px / ImageNet-22k to 1k
      architecture:
        family: hybrid_convolutional_transformer
        description: 'CvT-13: three-stage convolutional vision transformer; block depths [1, 2,
          10]. Final-stage class token. Brain-Score records the blocks and final layernorm.'
      parameter_count: 20000000
      parameter_count_exact: false
      recurrent: false
      input_resolution:
        channels: 3
        height: 384
        width: 384
      visual_degrees: 8.0
      visual_degrees_description: 8° inherited from ModelCommitment; historical scoring configuration
        unconfirmed.
      supervision:
        type: supervised
        description: Labeled image classification.
    training:
      process: ImageNet-22k pretraining, then ImageNet-1k fine-tuning. No additional training
        in the submission.
      objective: 1,000-class image classification. Pretrained with ImageNet-22k labels.
      loss: Soft-target cross-entropy; smoothing 0.1 (reference recipe; checkpoint unconfirmed).
      learning_rate: 0.00025 × GPU count; cosine decay (reference recipe; checkpoint unconfirmed).
      batch_size: 256 images/GPU (reference recipe; checkpoint unconfirmed).
      preprocessing: Mixup, CutMix, RandAugment, flips, color jitter and random erasing (reference
        recipe; checkpoint unconfirmed).
    data:
      training_datasets:
      - name: ImageNet-22k
        role: pretraining
        description: ≈14M images; ≈22K classes.
      - name: ImageNet-1k
        role: fine_tuning
        description: ≈1.3M images; 1,000 classes.
    io:
      modality: image
      interface: Transformers CvtForImageClassification via Brain-Score PytorchWrapper.
      input_format: RGB images; resize to 384 × 384; checkpoint AutoFeatureExtractor with ImageNet
        normalization. Processor specifies 224px despite the 384px wrapper; effective size unconfirmed.
      output_format: 1,000 ImageNet class logits; internal activations available through Brain-Score.
      tokenizer: Convolutional image patches; no text tokenizer.
    eval:
      test_datasets:
      - name: ImageNet-1k validation
        description: Used for published classifier evaluation; not an independent ImageNet test
          split and not a list of Brain-Score benchmarks.
      validation_datasets:
      - name: ImageNet-1k validation
        description: The official training recipe selects the ImageNet val split. Use in the exact
          Hub training run is not confirmed.
    people:
      creators:
      - Haiping Wu
      - Bin Xiao
      - Noel Codella
      - Mengchen Liu
      - Xiyang Dai
      - Lu Yuan
      - Lei Zhang
      organizations:
      - Microsoft
    use:
      applications:
      - Image classification
      - Internal feature extraction for Brain-Score neural and behavioral comparisons
      users:
      - Computer-vision and computational-neuroscience researchers (inferred audience).
      limitations:
      - Classifier restricted to 1,000 ImageNet labels.
      - Unpinned Hub revisions; historical weights and preprocessing unconfirmed.
    provenance:
      weights_provider: Microsoft (Hugging Face microsoft organization)
      checkpoint: microsoft/cvt-13-384-22k
      source_url: https://huggingface.co/microsoft/cvt-13-384-22k
    legal:
      license: Apache-2.0
    sources:
      submitted_loader:
        kind: other
        url: https://github.com/brain-score/vision/blob/ece4881b3f6f810079ee349367ea5f96e474349d/brainscore_vision/models/cvt_cvt_13_384_in22k_finetuned_in1k_4/model.py
        citation: get_model, get_layers and load_preprocess_images
      registration:
        kind: other
        url: https://github.com/brain-score/vision/blob/ece4881b3f6f810079ee349367ea5f96e474349d/brainscore_vision/models/cvt_cvt_13_384_in22k_finetuned_in1k_4/__init__.py
        citation: model_registry entry and ModelCommitment arguments
      model_commitment:
        kind: other
        url: https://github.com/brain-score/vision/blob/ece4881b3f6f810079ee349367ea5f96e474349d/brainscore_vision/model_helpers/brain_transformation/__init__.py
        citation: 'ModelCommitment.__init__: visual_degrees default'
      hf_card:
        kind: huggingface
        url: https://huggingface.co/microsoft/cvt-13-384-22k/blob/dffbc91c364d4bc4c5f353f9c2cd1244b2fdf388/README.md
