schema_version: '2.0'
domain: vision
models:
  deit3_base_patch16_224_fb_in22k_ft_in1k_gram_aligned_dinov3:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/deit3_base_patch16_224_fb_in22k_ft_in1k_gram_aligned_dinov3
        citation: Brain-Score vision plugin code, brainscore_vision/models/deit3_base_patch16_224_fb_in22k_ft_in1k_gram_aligned_dinov3
      fusion_models:
        kind: huggingface
        url: https://huggingface.co/HosseinAdeli/fusion_models
        citation: HosseinAdeli/fusion_models on Hugging Face (empty model card; params.txt
          per checkpoint)
    model:
      display_name: deit3_base_patch16_224_fb_in22k_ft_in1k_gram_aligned_dinov3
      architecture:
        family: vision_transformer
        description: deit3_base_patch16_224 (timm architecture) with weights from
          a Gram-matrix alignment fine-tune; loaded with strict=False
      parameter_count: 86585320
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: other
        description: Supervised base model, fine-tuned with feature distillation (Gram
          alignment) from a self-supervised DINOv3 teacher plus a small label loss
    training:
      process: Starting from timm deit3_base_patch16_224.fb_in22k_ft_in1k, fine-tuned
        for 100 epochs on ImageNet-1k with a Gram-matrix alignment loss toward DINOv3
        ViT-B/16 teacher features (weight 100) plus a label loss (weight 0.1), per
        params.txt in the checkpoint folder
      loss: 100 x Gram-matrix alignment loss to DINOv3 features + 0.1 x classification
        loss
      learning_rate: 5e-4, weight decay 1e-4
      batch_size: '16'
    data:
      summary: 'ImageNet-1k (fine-tuning); base weights: ImageNet-21k (also called
        ImageNet-22k) -> ImageNet-1k (ILSVRC-2012)'
      training_datasets:
      - identifier: imagenet-21k
        name: ImageNet-21k (also called ImageNet-22k)
        role: pretraining
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: pretraining
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: fine_tuning
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: Hossein Adeli (Hugging Face HosseinAdeli/fusion_models)
      checkpoint: HosseinAdeli/fusion_models gram_aligned/deit3_base_patch16_224.fb_in22k_ft_in1k_gram_aligned_dinov3/checkpoint.pth
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/deit3_base_patch16_224_fb_in22k_ft_in1k_gram_aligned_dinov3
    legal:
      license: Apache-2.0
    people:
      creators:
      - Hossein Adeli
    lineage:
      base_models:
      - name: timm deit3_base_patch16_224.fb_in22k_ft_in1k
        relationship: fine_tuned_from
