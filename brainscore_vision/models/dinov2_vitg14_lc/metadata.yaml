schema_version: '2.0'
domain: vision
models:
  dinov2_vitg14_lc:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/dinov2_vitg14_lc
        citation: Brain-Score vision plugin code, brainscore_vision/models/dinov2_vitg14_lc
      dinov2:
        kind: paper
        url: https://arxiv.org/abs/2304.07193
        citation: 'Oquab et al. (2024), DINOv2: Learning Robust Visual Features without
          Supervision, TMLR'
      dinov2_repo:
        kind: other
        url: https://github.com/facebookresearch/dinov2
        citation: facebookresearch/dinov2 repository
    model:
      display_name: dinov2_vitg14_lc
      version: torch.hub facebookresearch/dinov2 dinov2_vitg14_lc
      architecture:
        family: vision_transformer
        description: 'DINOv2 ViT-g/14 backbone with the official ImageNet-1k linear
          classifier on the class tokens of the last 4 blocks plus the mean patch
          token. Parameter count: backbone + mask token + linear head'
      parameter_count: 1144161768
      parameter_count_exact: false
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: self_supervised
        description: DINOv2 self-supervised backbone (no labels); linear classifier
          trained on ImageNet-1k labels on frozen features
    training:
      process: Self-supervised DINOv2 pretraining on LVD-142M (ViT-g trained directly,
        smaller models distilled from ViT-g), then a linear classifier on frozen features
        trained on ImageNet-1k
    data:
      summary: LVD-142M (self-supervised pretraining); ImageNet-1k (linear classifier)
      training_datasets:
      - identifier: other
        name: LVD-142M (curated DINOv2 image dataset)
        role: pretraining
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: fine_tuning
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: Meta AI (torch.hub facebookresearch/dinov2)
      checkpoint: torch.hub dinov2_vitg14_lc
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/dinov2_vitg14_lc
    legal:
      license: Apache-2.0
    people:
      organizations:
      - Meta AI Research
    use:
      applications:
      - Image classification
      - General-purpose visual features
    assertions:
