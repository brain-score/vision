schema_version: '2.0'
domain: vision
models:
  dinov2_vitl14_lc:
    sources:
      plugin:
        kind: other
        url: https://github.com/brain-score/vision/tree/fbe003a02053be4327b42b29b2a011817a99dd83/brainscore_vision/models/dinov2_vitl14_lc
        citation: Brain-Score plugin __init__.py and model.py (registry, loader, layers)
      paper:
        kind: paper
        url: https://arxiv.org/pdf/2304.07193
        citation: Oquab et al., DINOv2, arXiv 2304.07193v2 (TMLR 01/2024)
      hub_classifiers:
        kind: other
        url: https://raw.githubusercontent.com/facebookresearch/dinov2/main/dinov2/hub/classifiers.py
        citation: dinov2/hub/classifiers.py, dinov2_vitl14_lc and _LinearClassifierWrapper
      hub_backbones:
        kind: other
        url: https://raw.githubusercontent.com/facebookresearch/dinov2/main/dinov2/hub/backbones.py
        citation: dinov2/hub/backbones.py, _make_dinov2_model defaults
      hubconf:
        kind: other
        url: https://raw.githubusercontent.com/facebookresearch/dinov2/main/hubconf.py
        citation: hubconf.py torch.hub entry points
      readme:
        kind: other
        url: https://raw.githubusercontent.com/facebookresearch/dinov2/main/README.md
        citation: DINOv2 README, pretrained heads, evaluation and License sections
      license_file:
        kind: other
        url: https://raw.githubusercontent.com/facebookresearch/dinov2/main/LICENSE
        citation: DINOv2 repository LICENSE (Apache License 2.0)
      hf_api:
        kind: huggingface
        url: https://huggingface.co/api/models/facebook/dinov2-large
        citation: Related backbone-only repo facebook/dinov2-large, safetensors parameter
          total
      hf_card:
        kind: huggingface
        url: https://huggingface.co/facebook/dinov2-large/resolve/main/README.md
        citation: Related backbone-only card facebook/dinov2-large (written by Hugging
          Face team)
    model:
      display_name: DINOv2 ViT-L/14 with ImageNet linear classifier
      architecture:
        family: vision_transformer
        description: 'DINOv2 ViT-L/14 backbone (distilled variant: 24 blocks, 1024
          dim, 16 heads, MLP FFN) plus a linear 1000-class head on the class tokens
          of the last 4 blocks and the mean-pooled last-block patch tokens.'
      parameter_count: 309489640
      parameter_count_exact: false
      trainable_layers: Backbone frozen during ImageNet head training; only the linear
        head was trained with labels.
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: self_supervised
        description: Self-supervised backbone (distilled from DINOv2 ViT-g/14); supervised
          linear head trained on ImageNet-1k labels.
    training:
      process: 'Backbone: self-supervised distillation from a frozen DINOv2 ViT-g/14
        teacher on LVD-142M (paper recipe: 625k iterations, AdamW, short 518 px phase
        at end). Head: linear probe on frozen features, SGD, 12,500 iterations.'
      objective: 'Backbone: match teacher image-level (DINO) and patch-level (iBOT)
        prototype distributions. Head: 1000-way ImageNet-1k classification.'
      loss: 'Backbone: DINO and iBOT cross-entropy terms with KoLeo regularizer (weight
        0.1, pretraining recipe). Head loss not stated.'
      learning_rate: 'Backbone recipe: 1e-3 (distilled ViT-L/14), 100k-iteration warmup.
        Head: grid search 1e-4 to 0.5; selected value not published.'
      batch_size: 'Backbone recipe: 2048 (distilled ViT-L/14; per-GPU split not stated).
        Head: not stated.'
      preprocessing: 'Pretraining: multi-crop, 224 px global and 98 px local crops,
        then 518 px adaptation. Head training: random-resized-crop augmentation.'
    data:
      summary: Backbone pretrained without labels on LVD-142M; linear head trained
        on ImageNet-1k labels.
      training_datasets:
      - identifier: other
        name: LVD-142M
        role: pretraining
        description: 142,109,386 curated, deduplicated unlabeled images; backbone
          distillation.
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
        description: Train split, 1.28M labeled images; linear head only, backbone
          frozen.
    eval:
      validation_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        description: Val top-1 86.3% for ViT-L/14 linear probe; also used for probe
          selection.
      test_datasets:
      - identifier: other
        name: ImageNet-V2
        description: Top-1 78.0% (ViT-L/14 linear probe).
      - identifier: other
        name: ImageNet-ReaL
        description: Top-1 89.5% (ViT-L/14 linear probe).
      - identifier: imagenet-a
        name: ImageNet-A
        description: Top-1 71.3% (ViT-L/14 linear probe, 224 px).
      - identifier: other
        name: ImageNet-R
        description: Top-1 74.4% (ViT-L/14 linear probe, 224 px).
      - identifier: imagenet-c
        name: ImageNet-C
        description: Error 31.5 (ViT-L/14 linear probe, 224 px; lower is better).
      - identifier: other
        name: ImageNet-Sketch
        description: Top-1 59.3% (ViT-L/14 linear probe, 224 px).
    io:
      modality: image
      interface: torch.hub dinov2_vitl14_lc wrapped by Brain-Score PytorchWrapper;
        activations from backbone.blocks 3, 7, 11, 15, 19, 23; behavioral readout
        from linear_head.
      input_format: RGB images at 224x224 via Brain-Score load_preprocess_images (16x16
        patches of 14 px); positional embeddings are defined at 518 px and interpolated.
      output_format: 1000 ImageNet-1k class logits per image, shape (B, 1000).
    provenance:
      weights_provider: Meta AI Research (FAIR), via torch.hub facebookresearch/dinov2
      checkpoint: 'torch.hub facebookresearch/dinov2 dinov2_vitl14_lc (layers=4):
        dinov2_vitl14_pretrain.pth + dinov2_vitl14_linear4_head.pth; hub ref not pinned.'
      source_url: https://github.com/facebookresearch/dinov2
    legal:
      license: Apache-2.0
    people:
      creators:
      - Maxime Oquab
      - Timothée Darcet
      - Théo Moutakanni
      - Huy V. Vo
      - Marc Szafraniec
      - Vasil Khalidov
      - Pierre Fernandez
      - Daniel Haziza
      - Francisco Massa
      - Alaaeldin El-Nouby
      - Mahmoud Assran
      - Nicolas Ballas
      - Wojciech Galuba
      - Russell Howes
      - Po-Yao Huang
      - Shang-Wen Li
      - Ishan Misra
      - Michael Rabbat
      - Vasu Sharma
      - Gabriel Synnaeve
      - Hu Xu
      - Hervé Jegou
      - Julien Mairal
      - Patrick Labatut
      - Armand Joulin
      - Piotr Bojanowski
      organizations:
      - Meta AI Research
      - Inria
    use:
      applications:
      - ImageNet-1k image classification
      - General-purpose frozen visual features with linear heads
      biases:
      - 'Family-level (ViT-g/14 only): lower Dollar Street accuracy for Africa (-25.7%
        vs Europe) and low-income households (-31.7% vs high); not evaluated for ViT-L/14.'
    lineage:
      base_models:
      - name: DINOv2 ViT-L/14 backbone (dinov2_vitl14, frozen)
        relationship: derived_from
      - name: DINOv2 ViT-g/14 (frozen distillation teacher)
        relationship: derived_from
