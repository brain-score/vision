schema_version: '2.0'
domain: vision
models:
  efficientnet-b7:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/efficientnet_b7
        citation: Brain-Score vision plugin code, brainscore_vision/models/efficientnet_b7
      efficientnet:
        kind: paper
        url: https://arxiv.org/abs/1905.11946
        citation: 'Tan & Le (2019), EfficientNet: Rethinking Model Scaling for Convolutional
          Neural Networks, ICML 2019'
    model:
      display_name: EfficientNet-B7
      architecture:
        family: convolutional_neural_network
        description: EfficientNet-B7 (Hugging Face transformers port of the TensorFlow
          weights)
      parameter_count: 66347960
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: 1000-class ImageNet-1k classification
    data:
      summary: ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way logits
    provenance:
      weights_provider: Google (Hugging Face Hub)
      checkpoint: google/efficientnet-b7
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/efficientnet_b7
    legal:
      license: Apache-2.0
    people:
      creators:
      - Mingxing Tan
      - Quoc V. Le
      organizations:
      - Google Brain
    use:
      applications:
      - Image classification
      - Feature extraction / backbone for vision tasks
      limitations:
      - Evaluated at 224x224 input, well below the 600x600 resolution EfficientNet-B7
        was trained for
    assertions:
    - path: /model/display_name
      status: probable
      sources:
      - efficientnet
      - plugin_code
    - path: /model/architecture/family
      status: probable
      sources:
      - plugin_code
    - path: /model/architecture/description
      status: probable
      sources:
      - plugin_code
    - path: /model/parameter_count
      status: probable
      sources:
      - plugin_code
    - path: /model/parameter_count_exact
      status: probable
      sources:
      - plugin_code
    - path: /model/recurrent
      status: probable
      sources:
      - plugin_code
    - path: /model/input_resolution/channels
      status: probable
      sources:
      - plugin_code
    - path: /model/input_resolution/height
