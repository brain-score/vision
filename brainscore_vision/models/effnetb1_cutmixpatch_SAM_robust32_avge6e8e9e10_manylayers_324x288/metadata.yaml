    model:
      display_name: effnetb1_cutmixpatch_SAM_robust32_avge6e8e9e10_manylayers_324x288
      version: tf_efficientnet_b1_ns_robust_cutmixpatchresize_SAM_e6e8e9e10.pth -
        CutMix-patch + SAM, epoch-avg 6/8/9/10
      architecture:
        family: convolutional_neural_network
        description: CNN (EfficientNet compound-scaled), adversarially/corruption-robust
          fine-tune with SAM + checkpoint averaging
      parameter_count: 7800000
      parameter_count_exact: false
      trainable_layers: All EfficientNet-B1 layers trained/fine-tuned; BatchNorm explicitly
        frozen (m.eval()) in stem + blocks 0-3 at inference time
      recurrent: false
      input_resolution:
        channels: 3
        height: 288
        width: 324
      visual_degrees: null
      visual_degrees_description: null
      supervision:
        type: self_supervised
        description: Fully supervised, with self-training (Noisy Student) component
          in base weights
    training:
      process: EfficientNet-B1 Noisy Student base -> further fine-tuned with CutMix-patch-resize
        augmentation + SAM optimizer -> weight-averaged across epochs 6,8,9,10; custom
        Albumentations preprocessing (324 resize -> 288 center crop); BN frozen in
        stem + blocks 0-3
      objective: Cross-entropy + robustness objective under SAM optimization (flat-minima
        seeking) + CutMix-patch augmentation
      loss: Cross-entropy (SAM-optimized)
      learning_rate: null
      batch_size: Inference batch_size=8 explicitly set; training batch size unconfirmed
      preprocessing: 'Custom Albumentations: Resize(324) -> CenterCrop(288) -> Normalize(ImageNet
        mean/std) -> ToTensorV2'
    data:
