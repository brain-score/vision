      trainable_layers: All EfficientNet-B1 layers trained/fine-tuned; BatchNorm explicitly
        frozen (m.eval()) in stem + blocks 0-3 (freeze list one block shorter than
        SAM variant) at inference time
      recurrent: false
      input_resolution:
        channels: 3
        height: 288
        width: 324
      visual_degrees: null
      visual_degrees_description: null
      supervision:
        type: self_supervised
        description: Fully supervised, with self-training (Noisy Student) component
          in base weights
    training:
      process: EfficientNet-B1 Noisy Student base -> further fine-tuned with CutMix-patch-resize
        + AugMix augmentation -> weight-averaged across epochs 4-7; same preprocessing/BN-freezing
        pattern as SAM variant, freeze list one block shorter
      objective: Cross-entropy + robustness objective under AugMix augmentation +
        CutMix-patch augmentation
      loss: Cross-entropy (AugMix-augmented)
      learning_rate: null
      batch_size: Inference batch_size=8 explicitly set; training batch size unconfirmed
      preprocessing: 'Custom Albumentations: Resize(324) -> CenterCrop(288) -> Normalize(ImageNet
        mean/std) -> ToTensorV2 (identical to SAM variant)'
