      version: tf_efficientnet_b1_ns_robust_cutmixpatchresize_augmix_e4toe7.pth -
        CutMix-patch + AugMix, epoch-avg 4-7
      architecture:
        family: convolutional_neural_network
        description: CNN (EfficientNet compound-scaled), adversarially/corruption-robust
          fine-tune with AugMix + checkpoint averaging
      parameter_count: 7800000
