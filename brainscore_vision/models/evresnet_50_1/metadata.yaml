schema_version: '2.0'
domain: vision
models:
  evresnet_50_1:
    sources:
      legacy:
        kind: unreviewed
        citation: Existing plugin metadata; primary sources need review.
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/evresnet_50_1
        citation: Brain-Score vision plugin code, brainscore_vision/models/evresnet_50_1
      piper2024:
        kind: paper
        url: https://arxiv.org/abs/2409.16838
        citation: Piper, Oliveira & Marques (2024), Explicitly Modeling Pre-Cortical
          Vision with a Neuro-Inspired Front-End Improves CNN Robustness, arXiv:2409.16838
    model:
      display_name: evresnet_50_1
      architecture:
        family: hybrid_biological_convolutional
        description: 'EVNet: neuro-inspired front-end RetinaBlock (P-cell color-opponent
          channels: default, M-cell channels: default) + VOneBlock (fixed Gabor filter
          bank, gabor_seed=1) followed by a ResNet-50 back-end (EVNet code bundled
          with the plugin)'
      parameter_count: 28154892
      parameter_count_exact: true
      trainable_layers: '54'
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: ImageNet-1k classification with a fixed neuro-inspired front-end
    training:
      process: Back-end trained on ImageNet-1k with the front-end held fixed
    data:
      summary: ImageNet-1k
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224, normalized with mean = std = 0.5
      output_format: 1000-way logits
    provenance:
      weights_provider: Lucas Piper (EVNets weights)
      checkpoint: Google Drive file id 1-41doOH_lePAMp3XryKgmuhX496VytgG
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/evresnet_50_1
    people:
      creators:
      - Lucas Piper
      - Arlindo L. Oliveira
      - Tiago Marques
    use:
      applications:
      - Modeling early (subcortical and V1) visual processing
      - Robustness to image perturbations
