schema_version: '2.0'
domain: vision
models:
  first_dev_learning_simple2:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/first_dev_learning_simple2
        citation: Brain-Score vision plugin code, brainscore_vision/models/first_dev_learning_simple2
    model:
      display_name: first_dev_learning_simple2
      architecture:
        family: convolutional_neural_network
        description: VGG-like encoder with k-winners competition and centered activations,
          trained with a CLAPP-style local learning rule, plus a linear classifier
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: self_supervised
        description: Local contrastive predictive plasticity (CLAPP checkpoint)
    training:
      process: Encoder checkpoint CLAPP0.ckpt from Hugging Face a-del/model_0; training
        not documented
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
    provenance:
      weights_provider: Hugging Face Hub (a-del/model_0)
      checkpoint: a-del/model_0/CLAPP0.ckpt
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/first_dev_learning_simple2
    assertions:
