schema_version: '2.0'
domain: vision
models:
  grcnn_109:
    sources:
      legacy:
        kind: unreviewed
        citation: Existing plugin metadata; primary sources need review.
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/grcnn_109
        citation: Brain-Score vision plugin code, brainscore_vision/models/grcnn_109
      wang2021:
        kind: other
        url: https://github.com/Jianf-Wang/GRCNN
        citation: Wang & Hu (2021), Convolutional Neural Networks with Gated Recurrent
          Connections, TPAMI; official GRCNN code and checkpoints (MIT license)
    model:
      display_name: GRCNN-109
      architecture:
        family: recurrent_convolutional_neural_network
        description: 'Gated Recurrent CNN (GRCNN-109): ResNet-style stages whose blocks
          are gated recurrent convolutional layers unrolled over a fixed number of
          iterations'
      parameter_count: 45075880
      parameter_count_exact: true
      trainable_layers: '120'
      recurrent: true
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: ImageNet-1k classification
    data:
      summary: ImageNet-1k
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224, ImageNet mean/std normalization
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: Official GRCNN release (Wang & Hu), copied to Brain-Score
        S3
      checkpoint: s3://brainscore-storage/brainscore-vision/models/grcnn_109/checkpoint_params_grcnn109.pt
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/grcnn_109
    legal:
      license: MIT
    people:
      creators:
      - Jianfeng Wang
      - Xiaolin Hu
      organizations:
      - Tsinghua University
    use:
      limitations:
      - The bibtex returned by the plugin cites an unrelated paper (GRCNN for flow
        charts)
    assertions:
