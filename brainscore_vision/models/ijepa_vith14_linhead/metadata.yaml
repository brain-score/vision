        classification head
      objective: I-JEPA/Classification
      loss: L2 loss + Supervised CE loss
      learning_rate: unknown + cosine LR schedule with 1 warmup epoch (min 1e-6, max
        1e-3)
      batch_size: unknown + 1024
      preprocessing: 'Standard ImageNet preprocessing: 224x224, normalization'
