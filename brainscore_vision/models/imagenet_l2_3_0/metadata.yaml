schema_version: '2.0'
domain: vision
models:
  imagenet_l2_3_0:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/imagenet_l2_3_0
        citation: Brain-Score vision plugin code, brainscore_vision/models/imagenet_l2_3_0
      salman2020:
        kind: paper
        url: https://arxiv.org/abs/2007.08489
        citation: Salman, Ilyas, Engstrom, Kapoor & Madry (2020), Do Adversarially
          Robust ImageNet Models Transfer Better?, NeurIPS 2020
    model:
      display_name: imagenet_l2_3_0
      architecture:
        family: convolutional_neural_network
        description: ResNet-50 (robustness library) adversarially trained on ImageNet-1k
      parameter_count: 25557032
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: Adversarial training (L2 PGD, epsilon 3) for ImageNet-1k classification
    training:
      process: L2 adversarial training with epsilon = 3 on ImageNet-1k (MadryLab release
        imagenet_l2_3_0.pt)
    data:
      summary: ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: MadryLab robustness release, copied to Brain-Score S3
      checkpoint: s3://brainscore-storage/brainscore-vision/models/imagenet_l2_3_0/imagenet_l2_3_0.pt
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/imagenet_l2_3_0
    people:
      organizations:
      - MIT (Madry lab)
    assertions:
