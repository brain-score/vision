schema_version: '2.0'
domain: vision
models:
  inception_v1:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/inception_v1
        citation: Brain-Score vision plugin code, brainscore_vision/models/inception_v1
      googlenet:
        kind: paper
        url: https://arxiv.org/abs/1409.4842
        citation: Szegedy et al. (2015), Going Deeper with Convolutions, CVPR 2015
      torchvision:
        kind: other
        url: https://pytorch.org/vision/stable/models.html
        citation: torchvision model zoo documentation
    model:
      display_name: GoogLeNet (Inception v1)
      version: IMAGENET1K_V1
      architecture:
        family: convolutional_neural_network
        description: GoogLeNet / Inception v1 (torchvision, loaded via torch.hub pytorch/vision:v0.10.0,
          auxiliary classifiers removed)
      parameter_count: 6624904
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: 1000-class ImageNet-1k classification
    data:
      summary: ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 256 px (short side), center-cropped to 224x224,
        normalized with mean = std = 0.5 (Brain-Score inception preprocessing)
      output_format: 1000-way logits
    provenance:
      weights_provider: torchvision (PyTorch)
      checkpoint: torchvision googlenet weights IMAGENET1K_V1
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/inception_v1
    legal:
      license: BSD-3-Clause
    people:
      creators:
      - Christian Szegedy
      - Wei Liu
      - Yangqing Jia
      - Pierre Sermanet
      - Scott Reed
      - Dragomir Anguelov
      - Dumitru Erhan
      - Vincent Vanhoucke
      - Andrew Rabinovich
      organizations:
      - Google
    use:
      applications:
      - Image classification
      - Feature extraction / backbone for vision tasks
    assertions:
    - path: /model/display_name
      status: probable
      sources:
      - googlenet
      - plugin_code
    - path: /model/version
      status: probable
      sources:
      - plugin_code
    - path: /model/architecture/family
      status: probable
      sources:
      - plugin_code
    - path: /model/architecture/description
      status: probable
      sources:
      - plugin_code
    - path: /model/parameter_count
      status: probable
