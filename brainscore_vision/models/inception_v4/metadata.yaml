      inception_v4:
        kind: paper
        url: https://arxiv.org/abs/1602.07261
        citation: Szegedy, Ioffe, Vanhoucke & Alemi (2017), Inception-v4, Inception-ResNet
          and the Impact of Residual Connections on Learning, AAAI 2017
      timm:
        kind: huggingface
        url: https://huggingface.co/timm
        citation: timm (PyTorch Image Models) model cards on Hugging Face
    model:
      display_name: Inception v4
      version: inception_v4.tf_in1k
      architecture:
        family: convolutional_neural_network
        description: Inception v4 (timm port of the TensorFlow weights)
