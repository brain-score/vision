schema_version: '2.0'
domain: vision
models:
  jem_imagenet_p0p9_s1:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/jem_imagenet_p0p9_s1
        citation: Brain-Score vision plugin code, brainscore_vision/models/jem_imagenet_p0p9_s1
      jem:
        kind: paper
        url: https://arxiv.org/abs/1912.03263
        citation: Grathwohl et al. (2020), Your Classifier is Secretly an Energy Based
          Model and You Should Treat it Like One, ICLR 2020
    model:
      display_name: jem_imagenet_p0p9_s1
      architecture:
        family: convolutional_neural_network
        description: 'Latent JEM: Wide-ResNet-22-8 energy-based classifier on the
          latent of a frozen Stable Diffusion VAE encoder (feed-forward at inference,
          no MCMC)'
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: Joint energy-based model training (classification plus generative
          energy term)
    training:
      process: Latent JEM trained on ImageNet with penalty p = 0.9, seed 1 (per plugin
        bibtex)
    data:
      summary: ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: Brain-Score submitter upload (user_843)
      checkpoint: s3://brainscore-storage/brainscore-vision/models/user_843/jem_imagenet_p0p9_s1.pt
