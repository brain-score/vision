      architecture:
        family: convolutional_neural_network
        description: 'AlexNetV2 (TF-slim alexnet_v2 layout) in PyTorch, not torchvision
          AlexNet: conv1 11x11 stride 4 (64), conv2 5x5 (192), conv3-conv5 3x3 (384,
          384, 256), ReLU, three 3x3 stride-2 max-pools, no local response normalization;
          fc6-fc8 are convolutions (5x5 to 4096, 1x1 to 4096, 1x1 to the class count)
          with dropout 0.5.'
      parameter_count: 50303912
      parameter_count_exact: true
      trainable_layers: '8'
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: Supervised image classification on ImageNet (ILSVRC-2012, 1000
          classes)
      visual_degrees: null
      visual_degrees_description: null
    training:
      process: 'Trained by Mehrer et al. (2020) in TensorFlow (TF-slim alexnet_v2);
        OSF checkpoint AlexNet/training_seed_04/model.ckpt_epoch89, which also holds
        momentum-optimizer slots. Paper methods (ImageNet instances): trained from
        scratch for 90 epochs with learning rate 0.01, momentum 0.9, weight decay
        0.0005, dropout 0.5, mini-batch 128 and a class-weighted loss; instances differ
        only in the weight-initialization seed. The paper reports 58.1% mean ILSVRC-2012
        top-1 over its 10 instances; OSF holds 5 ImageNet checkpoints and which paper
        instances they are is not stated. Converted to PyTorch by transposing each
        kernel from HWIO to OIHW (16 tensors, exact key match). Measured after conversion:
        ImageNet top-1 54.5%, top-5 76.8% on a 1,980-image ILSVRC-2012 validation
        sample with the plugin preprocessing. The untrained alexnet_training_seed_*
        plugins (issue #2459) remain as separate baselines.'
      objective: image classification (1000 classes)
      loss: Class-weighted classification loss correcting for unequal images per category
      learning_rate: '0.01'
      batch_size: '128'
      preprocessing: null
    data:
      summary: null
