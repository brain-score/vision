      process: 'Trained by Mehrer et al. (2020) in TensorFlow (TF-slim alexnet_v2);
        OSF checkpoint AlexNet/training_seed_07/model.ckpt_epoch89, which also holds
        momentum-optimizer slots. The paper describes ImageNet-trained AlexNet instances
        only. This checkpoint is identified as ecoset-trained from its 565-way output
        layer and the OSF extraction code; its training recipe is not documented.
        Converted to PyTorch by transposing each kernel from HWIO to OIHW (16 tensors,
        exact key match). Measured after conversion: ecoset accuracy not measured
        (the ecoset test set was not available); on ImageNet images its top-1 predictions
        agree 62-65% with the other ecoset seeds (chance 0.2%). The untrained alexnet_training_seed_*
