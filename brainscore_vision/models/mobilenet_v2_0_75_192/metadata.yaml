schema_version: '2.0'
domain: vision
models:
  mobilenet_v2_0_75_192:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/mobilenet_v2_0_75_192
        citation: Brain-Score vision plugin code, brainscore_vision/models/mobilenet_v2_0_75_192
      mobilenet_v2:
        kind: paper
        url: https://arxiv.org/abs/1801.04381
        citation: 'Sandler, Howard, Zhu, Zhmoginov & Chen (2018), MobileNetV2: Inverted
          Residuals and Linear Bottlenecks, CVPR 2018'
    model:
      display_name: MobileNetV2 0.75 192
      version: depth multiplier 0.75, resolution 192
      architecture:
        family: convolutional_neural_network
        description: MobileNetV2, depth multiplier 0.75, 192x192 input; parameter
          count from the Hugging Face MobileNetV2 definition with the same configuration
      parameter_count: 2637705
      parameter_count_exact: false
      recurrent: false
      input_resolution:
        channels: 3
        height: 192
        width: 192
      supervision:
        type: supervised
        description: 1000-class ImageNet-1k classification
    data:
      summary: ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 219 px (short side), center-cropped to 192x192,
        normalized with mean = std = 0.5 (Brain-Score inception preprocessing)
      output_format: 1001-way logits (ImageNet-1k classes plus background)
    provenance:
      weights_provider: Original TensorFlow MobileNetV2 release, converted to PyTorch
        and stored on Brain-Score S3
      checkpoint: s3://brainscore-storage/brainscore-vision/models/mobilenet_v2_0.75_192/mobilenet_v2_0.75_192_frozen.pth
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/mobilenet_v2_0_75_192
    people:
      creators:
      - Mark Sandler
      - Andrew Howard
      - Menglong Zhu
      - Andrey Zhmoginov
      - Liang-Chieh Chen
      organizations:
      - Google
    use:
      applications:
      - Image classification
      - Feature extraction / backbone for vision tasks
    assertions:
