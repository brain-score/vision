schema_version: '2.0'
domain: vision
models:
  mobilenet_v2_1_0_224:
    sources:
      legacy:
        kind: unreviewed
        citation: Existing plugin metadata; primary sources need review.
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/mobilenet_v2_1_0_224
        citation: Brain-Score vision plugin code, brainscore_vision/models/mobilenet_v2_1_0_224
      mobilenet_v2:
        kind: paper
        url: https://arxiv.org/abs/1801.04381
        citation: 'Sandler, Howard, Zhu, Zhmoginov & Chen (2018), MobileNetV2: Inverted
          Residuals and Linear Bottlenecks, CVPR 2018'
    model:
      display_name: MobileNetV2 1.0 224
      version: depth multiplier 1.0, resolution 224
      architecture:
        family: convolutional_neural_network
        description: MobileNetV2, depth multiplier 1.0, 224x224 input; parameter count
          from the Hugging Face MobileNetV2 definition with the same configuration
      parameter_count: 3506153
      parameter_count_exact: false
      trainable_layers: '53'
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: 1000-class ImageNet-1k classification
    data:
      summary: ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 256 px (short side), center-cropped to 224x224,
        normalized with mean = std = 0.5 (Brain-Score inception preprocessing)
      output_format: 1001-way logits (ImageNet-1k classes plus background)
    provenance:
