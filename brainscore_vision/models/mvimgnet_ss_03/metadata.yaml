schema_version: '2.0'
domain: vision
models:
  mvimgnet_ss_03:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/mvimgnet_ss_03
        citation: Brain-Score vision plugin code, brainscore_vision/models/mvimgnet_ss_03
    model:
      display_name: mvimgnet_ss_03
      architecture:
        family: convolutional_neural_network
        description: ResNet-50 (torchvision resnet50 definition) with a 1000-way linear
          readout as fc
      parameter_count: 25557032
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: self_supervised
        description: Self-supervised backbone; 1000-way linear classifier trained
          online with cross-entropy on detached backbone features; mapped to the torchvision
          fc layer
    training:
      process: ResNet-50 trained self-supervised in the "slow_steady" project (checkpoint
        variant "r2/LARS/lmda_0.3"); the plugin name indicates MVImgNet multi-view
        object videos as training data
    data:
      summary: MVImgNet (from the plugin name)
      training_datasets:
      - identifier: other
        name: MVImgNet
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way logits from the linear readout (fc)
    provenance:
      weights_provider: Thomas Yerxa (Flatiron Institute web server, users.flatironinstitute.org/~tyerxa)
      checkpoint: https://users.flatironinstitute.org/~tyerxa/slow_steady/training_checkpoints/slow_steady/r2/LARS/lmda_0.3/latest-rank0.pt
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/mvimgnet_ss_03
    people:
      creators:
      - Thomas Yerxa
    lineage:
      base_models:
      - name: ResNet-50
        relationship: variant_of
    assertions:
    - path: /model/display_name
      status: probable
      sources:
      - plugin_code
    - path: /model/architecture/family
      status: probable
      sources:
      - plugin_code
    - path: /model/architecture/description
      status: probable
      sources:
      - plugin_code
    - path: /model/parameter_count
      status: probable
      sources:
      - plugin_code
    - path: /model/parameter_count_exact
      status: probable
      sources:
