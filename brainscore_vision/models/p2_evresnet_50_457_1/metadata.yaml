schema_version: '2.0'
domain: vision
models:
  p2_evresnet_50_457_1:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/p2_evresnet_50_457_1
        citation: Brain-Score vision plugin code, brainscore_vision/models/p2_evresnet_50_457_1
      piper2025:
        kind: paper
        url: https://arxiv.org/abs/2506.03089
        citation: Piper, Oliveira & Marques (2025), Explicitly Modeling Subcortical
          Vision with a Neuro-Inspired Front-End Improves CNN Robustness, arXiv:2506.03089
    model:
      display_name: p2_evresnet_50_457_1
      architecture:
        family: hybrid_biological_convolutional
        description: 'EVNet: neuro-inspired front-end RetinaBlock (P-cell color-opponent
          channels: 3, M-cell channels: 0, light adaptation mode ''weber'') + VOneBlock
          (fixed Gabor filter bank, gabor_seed=457) followed by a ResNet-50 back-end
          (EVNet code bundled with the plugin); 25,580,264 trainable back-end parameters,
          front-end filters fixed'
      parameter_count: 28540493
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: none
        description: 'No trained weights: fixed (non-trainable) front-end filters
          and a randomly initialized back-end'
    training:
      process: 'Not trained: the plugin builds the network and loads no checkpoint'
    io:
      modality: image
      input_format: RGB image resized to 224x224, scaled to [0, 1] without mean/std
        normalization
      output_format: 1000-way logits
    provenance:
      weights_provider: 'None: no trained weights are loaded'
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/p2_evresnet_50_457_1
    people:
      creators:
      - Lucas Piper
      - Arlindo L. Oliveira
      - Tiago Marques
    use:
      applications:
      - Modeling early (subcortical and V1) visual processing
      - Robustness to image perturbations
      limitations:
      - Scored without trained weights (random back-end initialization)
    assertions:
