schema_version: '2.0'
domain: vision
models:
  persistence_mem:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/persistence_mem
        citation: Brain-Score vision plugin code, brainscore_vision/models/persistence_mem
    model:
      display_name: persistence_mem
      architecture:
        family: convolutional_neural_network
        description: ResNet-50 with a persistence-memory module unrolled for 4 steps
          and a 100-way head
      recurrent: true
      input_resolution:
        channels: 3
        height: 224
        width: 224
    training:
      process: Training data and recipe not documented (100-way output)
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 100-way logits
    provenance:
      weights_provider: Hugging Face Hub (emirhaninan814/persistence_mem_weights)
      checkpoint: https://huggingface.co/emirhaninan814/persistence_mem_weights/resolve/main/persistence_mem.pth
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/persistence_mem
    assertions:
    - path: /model/display_name
      status: probable
      sources:
      - plugin_code
    - path: /model/architecture/family
      status: probable
      sources:
      - plugin_code
    - path: /model/architecture/description
      status: probable
      sources:
      - plugin_code
    - path: /model/recurrent
      status: probable
      sources:
      - plugin_code
    - path: /model/input_resolution/channels
      status: probable
      sources:
      - plugin_code
    - path: /model/input_resolution/height
      status: probable
      sources:
      - plugin_code
    - path: /model/input_resolution/width
      status: probable
      sources:
      - plugin_code
    - path: /training/process
      status: probable
      sources:
      - plugin_code
    - path: /io/modality
      status: probable
      sources:
      - plugin_code
    - path: /io/input_format
      status: probable
      sources:
      - plugin_code
    - path: /io/output_format
      status: probable
      sources:
      - plugin_code
    - path: /provenance/weights_provider
      status: probable
      sources:
      - plugin_code
    - path: /provenance/checkpoint
      status: probable
