      modality: image
      interface: image, single 'pixels' pseudo-layer – raw RGB array resized to 256x256x3
        (196,608 values)
      input_format: image, single 'pixels' pseudo-layer – raw RGB array resized to
        256x256x3 (196,608 values)
      output_format: null
      tokenizer: null
