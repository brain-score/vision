      license: MIT License (Brain-Score repo)
    eval:
      test_datasets:
      - identifier: brain-score-benchmark-stimuli-sets-free
        name: Brain-Score benchmark stimuli sets (FreemanZiemba2013 V1/V2, MajajHong2015
          V4/IT, Sanghavi2020/SanghaviJozwik2020/SanghaviMurty2020, Rajalingham2018-i2n
          behavioral, etc.) – not a classification test set
        description: null
    use:
      applications:
      - Baseline/floor ("null model") for interpreting Brain-Score results – isolates
        how much of a real model's score reflects learned representation vs. trivial
        pixel similarity
      limitations:
      - Captures no learned/semantic features
      - scores near the bottom of the public leaderboard on nearly all neural (V1,
        V2, V4, IT) and behavioral benchmarks (~490-510th of ~511 models)
      users:
      - Brain-Score benchmark developers/researchers needing a reference floor score
    people:
