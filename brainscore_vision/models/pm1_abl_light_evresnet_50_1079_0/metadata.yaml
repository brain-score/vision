schema_version: '2.0'
domain: vision
models:
  pm1_abl_light_evresnet_50_1079_0:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/pm1_abl_light_evresnet_50_1079_0
        citation: Brain-Score vision plugin code, brainscore_vision/models/pm1_abl_light_evresnet_50_1079_0
      piper2025:
        kind: paper
        url: https://arxiv.org/abs/2506.03089
        citation: Piper, Oliveira & Marques (2025), Explicitly Modeling Subcortical
          Vision with a Neuro-Inspired Front-End Improves CNN Robustness, arXiv:2506.03089
    model:
      display_name: pm1_abl_light_evresnet_50_1079_0
      architecture:
        family: hybrid_biological_convolutional
        description: 'EVNet: neuro-inspired front-end RetinaBlock (P-cell color-opponent
          channels: 3, M-cell channels: 1, light adaptation off, light adaptation
          mode ''carandini'') + VOneBlock (fixed Gabor filter bank, gabor_seed=1079)
          followed by a ResNet-50 back-end (EVNet code bundled with the plugin); 25,580,264
          trainable back-end parameters, front-end filters fixed'
      parameter_count: 29533356
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: none
        description: 'No trained weights: fixed (non-trainable) front-end filters
          and a randomly initialized back-end'
    training:
      process: 'Not trained: the plugin builds the network and loads no checkpoint'
    io:
      modality: image
      input_format: RGB image resized to 224x224, normalized with mean = std = 0.5
      output_format: 1000-way logits
    provenance:
      weights_provider: 'None: no trained weights are loaded'
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/pm1_abl_light_evresnet_50_1079_0
    people:
      creators:
      - Lucas Piper
      - Arlindo L. Oliveira
      - Tiago Marques
    use:
      applications:
      - Modeling early (subcortical and V1) visual processing
      - Robustness to image perturbations
      limitations:
      - Scored without trained weights (random back-end initialization)
    assertions:
