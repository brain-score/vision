    model:
      display_name: pnasnet_large_halfPrecision
      version: pnasnet5large.tf_in1k timm tag, cast to FP16
      architecture:
        family: convolutional_neural_network
        description: CNN, NAS-derived cell-based architecture (Progressive NAS), FP16
      parameter_count: 86100000
      parameter_count_exact: false
      trainable_layers: All PNASNet layers trained during original TF training; loaded
        frozen for inference (FP16 cast, not retrained)
      recurrent: false
      input_resolution:
        channels: 3
        height: 331
        width: 331
      visual_degrees: null
      visual_degrees_description: null
      supervision:
        type: supervised
        description: Fully supervised
    training:
      process: timm pnasnet5large.tf_in1k loaded pretrained then cast to FP16 (.half())
        for reduced memory/larger batch size; Inception-style preprocessing at 331x331
      objective: Cross-entropy classification
      loss: Cross-entropy
      learning_rate: null
      batch_size: Inference batch_size=8 explicitly set (FP16 allows larger batch);
        training batch size unconfirmed
      preprocessing: load_preprocess_images, image_size=331, preprocess_type='inception'
    data:
      summary: ImageNet-1k (original TF PNASNet training)
      training_datasets:
      - identifier: imagenet-1k-original-tf-pnasnet-trainin
        name: ImageNet-1k (original TF PNASNet training)
        description: null
        role: training
    io:
      modality: image
      interface: RGB tensor 3x331x331 (FP16) -> intermediate activations at cell_0-10
        + global_pool
      input_format: RGB tensor 3x331x331 (FP16)
      output_format: intermediate activations at cell_0-10 + global_pool
      tokenizer: null
    provenance:
      weights_provider: timm / Ross Wightman (PyTorch port of original TF PNASNet
        weights)
      checkpoint: pnasnet5large.tf_in1k (timm hub identifier)
      source_url: null
      curation_confidence: high
    legal:
      license: 'Submission code: MIT; timm weights: Apache 2.0'
    eval:
      test_datasets:
