        description: null
      validation_datasets:
      - identifier: imagenet-1k-standard-validation-split
        name: ImageNet-1K standard validation split
        description: null
    use:
      applications:
      - General image classification
      - efficient-inference (FP16) research
      biases:
      - Inherits ImageNet dataset biases
      limitations:
      - FP16 may introduce minor numerical precision differences vs FP32 baseline
      users:
      - ML practitioners needing efficient NAS-derived backbones
    people:
