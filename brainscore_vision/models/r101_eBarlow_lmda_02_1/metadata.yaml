schema_version: '2.0'
domain: vision
models:
  r101_eBarlow_lmda_02_1:
    sources:
      legacy:
        kind: unreviewed
        citation: Existing plugin metadata; primary sources need review.
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/r101_eBarlow_lmda_02_1
        citation: Brain-Score vision plugin code, brainscore_vision/models/r101_eBarlow_lmda_02_1
      yerxa2024:
        kind: paper
        url: https://proceedings.neurips.cc/paper_files/paper/2024/hash/ae28c7bc9414ffd8ffd2b3d454e6ef3e-Abstract-Conference.html
        citation: Yerxa, Feather, Simoncelli & Chung (2024), Contrastive-Equivariant
          Self-Supervised Learning Improves Alignment with Primate Visual Area IT,
          NeurIPS 2024
    model:
      display_name: r101_eBarlow_lmda_02_1
      architecture:
        family: convolutional_neural_network
        description: ResNet-101 (torchvision resnet101 definition) with a 1000-way
          linear readout as fc
      parameter_count: 44549160
      parameter_count_exact: true
      trainable_layers: '105'
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: self_supervised
        description: Self-supervised backbone; 1000-way linear classifier trained
          online with cross-entropy on detached backbone features; mapped to the torchvision
          fc layer
    training:
      process: ResNet-101 trained self-supervised on ImageNet-1k with contrastive-equivariant
        Barlow Twins (CE-SSL), equivariance weight lambda = 0.2; run "1" (100 epochs)
        of the CE-SSL project
      objective: (1 - lambda) * invariant SSL loss + lambda * contrastive-equivariant
        loss on differences between pairs of images that share the same augmentation
      learning_rate: LARS optimizer, batch size 2048, base learning rate 4.8 with
        10-epoch linear warm-up and cosine decay, weight decay 1e-6, momentum 0.9
      batch_size: '2048'
      preprocessing: BYOL augmentations (random resized crop, colour jitter, Gaussian
        blur, solarization, horizontal flip)
    data:
      summary: ImageNet-1k
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way logits from the linear readout (fc)
    provenance:
      weights_provider: Thomas Yerxa (Flatiron Institute web server, users.flatironinstitute.org/~tyerxa)
      checkpoint: https://users.flatironinstitute.org/~tyerxa/equi_proj/training_checkpoints/resnet101/imagenet_1k/paired/lmda_0.2/Barlow_1/latest-rank0
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/r101_eBarlow_lmda_02_1
    people:
      creators:
      - Thomas Yerxa
      - Jenelle Feather
      - Eero P. Simoncelli
      - SueYeon Chung
      organizations:
      - New York University
      - Flatiron Institute
    use:
      applications:
      - Self-supervised representation learning
      - Modeling primate ventral stream (IT) responses
    lineage:
      base_models:
      - name: ResNet-101
        relationship: variant_of
