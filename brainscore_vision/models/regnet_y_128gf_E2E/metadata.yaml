      - Mannat Singh
      - Laura Gustafson
      - Aaron Adcock
      - Vinicius de Freitas Reis
      - Bugra Gedik
      - Raj Prateek Kosaraju
      - Dhruv Mahajan
      - Ross Girshick
      - Piotr Dollár
      - Laurens van der Maaten
      organizations:
      - Meta AI
    use:
      applications:
      - Image classification
      - Feature extraction / backbone for vision tasks
    lineage:
      base_models:
      - name: RegNetY-128GF
        relationship: variant_of
