schema_version: '2.0'
domain: vision
models:
  regnet_y_128gf_E2E:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/regnet_y_128gf_E2E
        citation: Brain-Score vision plugin code, brainscore_vision/models/regnet_y_128gf_E2E
      swag:
        kind: paper
        url: https://arxiv.org/abs/2201.08371
        citation: Singh et al. (2022), Revisiting Weakly Supervised Pre-Training of
          Visual Perception Models, CVPR 2022
      torchvision:
        kind: other
        url: https://pytorch.org/vision/stable/models.html
        citation: torchvision model zoo documentation
    model:
      display_name: RegNetY-128GF (SWAG, end-to-end fine-tuned)
      version: IMAGENET1K_SWAG_E2E_V1
      architecture:
        family: convolutional_neural_network
        description: RegNetY-128GF (torchvision)
      parameter_count: 644812894
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 384
        width: 384
      supervision:
        type: weakly_supervised
        description: Weakly supervised hashtag prediction pretraining, then supervised
          end-to-end ImageNet-1k fine-tuning
    training:
      process: 'SWAG: weakly supervised pretraining on Instagram images with hashtags,
        then end-to-end fine-tuning on ImageNet-1k at 384x384'
    data:
      summary: Instagram ~3.6B images with hashtags (SWAG), ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: other
        name: Instagram ~3.6B images with hashtags (SWAG)
        role: pretraining
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: fine_tuning
    io:
      modality: image
      input_format: RGB image resized to 384x384 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way logits
    provenance:
      weights_provider: torchvision (PyTorch)
      checkpoint: torchvision regnet_y_128gf weights IMAGENET1K_SWAG_E2E_V1
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/regnet_y_128gf_E2E
    legal:
      license: CC-BY-NC-4.0
    people:
