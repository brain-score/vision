    model:
      display_name: resnet50-SIN
      version: Geirhos et al. 2019 model A weights
      architecture:
        family: convolutional_neural_network
        description: CNN (ResNet), texture/shape-bias supervised training
      parameter_count: 25600000
      parameter_count_exact: false
      trainable_layers: All ResNet-50 layers trainable (60 epochs on SIN)
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      visual_degrees: null
      visual_degrees_description: Commonly 8 degrees for Brain-Score ResNet-50 baselines
        (unconfirmed for this exact entry)
      supervision:
        type: supervised
        description: Fully supervised (1000-way classification, on SIN labels)
    training:
      process: Standard ResNet-50 trained exclusively on Stylized-ImageNet (SIN) for
        60 epochs, SGD momentum 0.9, weight decay 1e-4, LR 0.1 decayed x0.1 at epochs
        20 and 40, batch size 256 (Geirhos et al. 2019, model A)
      objective: Cross-entropy classification loss
      loss: Cross-entropy
      learning_rate: 0.1, multiplied by 0.1 after 20 and 40 epochs
      batch_size: '256'
      preprocessing: Standard torchvision ImageNet preprocessing (resize/crop 224,
        ImageNet mean/std)
    data:
      summary: Stylized-ImageNet (SIN) only
      training_datasets:
      - identifier: stylized-imagenet-sin-only
        name: Stylized-ImageNet (SIN) only
        description: null
        role: training
    io:
      modality: image
      interface: RGB tensor 3x224x224 -> 1000-class logits or intermediate activations
      input_format: RGB tensor 3x224x224
      output_format: 1000-class logits or intermediate activations
      tokenizer: null
    provenance:
      weights_provider: Robert Geirhos / Bethge Lab
      checkpoint: resnet50_train_60_epochs-c8e5653e.pth.tar
      source_url: null
      curation_confidence: null
    legal:
      license: null
    eval:
      test_datasets:
      - identifier: imagenet-val-geirhos-cue-conflict-shap
        name: ImageNet val + Geirhos cue-conflict shape/texture stimuli
        description: null
      validation_datasets:
      - identifier: imagenet-1k-standard-validation-split
        name: ImageNet-1K standard validation split
        description: null
    use:
      applications:
      - Shape-bias / texture-bias robustness research
      biases:
      - Strong shape bias (~81%) by design
      - reduced sensitivity to natural image statistics
      limitations:
      - Lower standard ImageNet accuracy than IN-trained ResNet-50 due to stylized-only
        training
      users:
      - Vision neuroscientists and robustness researchers
    people:
      creators:
      - Robert Geirhos et al. (Bethge Lab)
      organizations:
      - University of Tuebingen / Bethge Lab
    lineage:
      base_models:
      - identifier: resnet-50
        name: ResNet-50
        relationship: variant_of
