    model:
      display_name: resnet50-SIN_IN
      version: Geirhos et al. 2019 model B weights
      architecture:
        family: convolutional_neural_network
        description: CNN (ResNet), texture/shape-bias supervised training
      parameter_count: 25600000
      parameter_count_exact: false
      trainable_layers: All ResNet-50 layers trainable (45 epochs on combined SIN+IN)
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      visual_degrees: null
      visual_degrees_description: Commonly 8 degrees for Brain-Score ResNet-50 baselines
        (unconfirmed for this exact entry)
      supervision:
        type: supervised
        description: Fully supervised (1000-way classification, on SIN+IN labels)
    training:
      process: Standard ResNet-50 trained jointly on combined SIN+IN for 45 epochs
        (~90 epochs-equivalent since the combined dataset is 2x size), same SGD recipe
        (Geirhos et al. 2019, model B)
      objective: Cross-entropy classification loss
      loss: Cross-entropy
      learning_rate: null
      batch_size: 256 (same PyTorch ImageNet training script)
      preprocessing: Standard torchvision ImageNet preprocessing
    data:
      summary: Stylized-ImageNet (SIN) + ImageNet (IN) combined
      training_datasets:
      - identifier: stylized-imagenet-sin-imagenet-in
        name: Stylized-ImageNet (SIN) + ImageNet (IN) combined
        description: null
        role: training
    io:
      modality: image
      interface: RGB tensor 3x224x224 -> 1000-class logits or intermediate activations
      input_format: RGB tensor 3x224x224
      output_format: 1000-class logits or intermediate activations
      tokenizer: null
    provenance:
      weights_provider: Robert Geirhos / Bethge Lab
      checkpoint: resnet50_train_45_epochs_combined_IN_SF-2a0d100e.pth.tar
      source_url: null
      curation_confidence: null
