    model:
      display_name: resnet50-SIN_IN_IN
      version: Geirhos et al. 2019 model C weights (same underlying model as resnet_SIN_IN_FT_IN)
      architecture:
        family: convolutional_neural_network
        description: CNN (ResNet), texture/shape-bias supervised training
      parameter_count: 25600000
      parameter_count_exact: false
      trainable_layers: All ResNet-50 layers trainable across both training stages
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      visual_degrees: null
      visual_degrees_description: Commonly 8 degrees for Brain-Score ResNet-50 baselines
        (unconfirmed for this exact entry)
      supervision:
        type: supervised
        description: Fully supervised (1000-way classification)
    training:
      process: Model B (SIN+IN jointly trained) further fine-tuned on ImageNet alone
        for 60 epochs with LR decay after 30 epochs (Geirhos et al. 2019, model C)
        - same underlying model as resnet_SIN_IN_FT_IN
      objective: Cross-entropy classification loss
      loss: Cross-entropy
      learning_rate: LR decay after 30 epochs during fine-tune stage (per repo); base
        LR schedule as in model B
      batch_size: 256 (same PyTorch ImageNet training script)
      preprocessing: Standard torchvision ImageNet preprocessing
    data:
      summary: Stylized-ImageNet (SIN) + ImageNet (IN), then ImageNet fine-tune
      training_datasets:
      - identifier: stylized-imagenet-sin-imagenet-in
        name: Stylized-ImageNet (SIN) + ImageNet (IN), then ImageNet fine-tune
        description: null
        role: training
    io:
      modality: image
      interface: RGB tensor 3x224x224 -> 1000-class logits or intermediate activations
      input_format: RGB tensor 3x224x224
      output_format: 1000-class logits or intermediate activations
      tokenizer: null
    provenance:
      weights_provider: Robert Geirhos / Bethge Lab
      checkpoint: resnet50_finetune_60_epochs_lr_decay_after_30_start_resnet50_train_45_epochs_combined_IN_SF-ca06340c.pth.tar
      source_url: null
      curation_confidence: null
    legal:
      license: null
    eval:
      test_datasets:
      - identifier: imagenet-val-geirhos-cue-conflict-shap
        name: ImageNet val + Geirhos cue-conflict shape/texture stimuli
        description: null
      validation_datasets:
      - identifier: imagenet-1k-standard-validation-split
        name: ImageNet-1K standard validation split
        description: null
    use:
      applications:
      - Shape-bias / texture-bias robustness research
      biases:
      - Texture-biased again after fine-tuning, similar to standard ImageNet-trained
        ResNet-50
      limitations:
      - Fine-tuning on IN reverts most of the shape-bias gained from SIN training
      users:
      - Vision neuroscientists and robustness researchers
    people:
      creators:
      - Robert Geirhos et al. (Bethge Lab)
      organizations:
      - University of Tuebingen / Bethge Lab
