schema_version: '2.0'
domain: vision
models:
  resnet50-barlow:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/resnet50_barlow
        citation: Brain-Score vision plugin code, brainscore_vision/models/resnet50_barlow
      method:
        kind: paper
        url: https://arxiv.org/abs/2103.03230
        citation: 'Zbontar, Jing, Misra, LeCun & Deny (2021), Barlow Twins: Self-Supervised
          Learning via Redundancy Reduction, ICML 2021'
      repo:
        kind: other
        url: https://github.com/facebookresearch/barlowtwins
        citation: facebookresearch/barlowtwins
    model:
      display_name: resnet50-barlow
      architecture:
        family: convolutional_neural_network
        description: ResNet-50 backbone (fc removed) from torch.hub facebookresearch/barlowtwins:main
      parameter_count: 23508032
      parameter_count_exact: false
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: self_supervised
        description: Barlow Twins self-supervised pretraining, no labels
    training:
      process: Barlow Twins self-supervised pretraining of ResNet-50 on ImageNet-1k
        (released weights)
    data:
      summary: ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: pretraining
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
    provenance:
      weights_provider: Meta AI (torch.hub facebookresearch/barlowtwins)
      checkpoint: torch.hub facebookresearch/barlowtwins:main resnet50
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/resnet50_barlow
    assertions:
    - path: /model/display_name
      status: probable
      sources:
