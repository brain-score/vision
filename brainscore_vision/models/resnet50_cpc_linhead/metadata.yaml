schema_version: '2.0'
domain: vision
models:
  resnet50_cpc_linhead:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/resnet50_cpc_linhead
        citation: Brain-Score vision plugin code, brainscore_vision/models/resnet50_cpc_linhead
      card:
        kind: huggingface
        url: https://huggingface.co/niels-c/resnet50_cpc_linhead
        citation: Hugging Face model card niels-c/resnet50_cpc_linhead
      method_paper:
        kind: paper
        url: https://arxiv.org/abs/1905.09272
        citation: Henaff et al. (2020), Data-Efficient Image Recognition with Contrastive
          Predictive Coding, ICML 2020
    model:
      display_name: resnet50_cpc_linhead
      architecture:
        family: convolutional_neural_network
        description: ResNet-50 (timm, GroupNorm with one group in place of batch norm,
          as in CPC v2) with a linear head on the 2048-d pooled features
      parameter_count: 25557032
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: self_supervised
        description: Self-supervised CPC v2 backbone (frozen); linear head trained
          with ImageNet-1k labels
    training:
      process: ResNet-50 pretrained self-supervised with CPC v2 by the submitter;
        backbone frozen and a linear ImageNet-1k head trained on top (per plugin code
        and repository name); training recipe not documented in the plugin or the
        model card
    data:
      summary: ImageNet-1k (linear head); backbone pretraining data not documented
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: fine_tuning
        description: Linear head
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits from the linear head (backbone.fc)
    provenance:
      weights_provider: Hugging Face Hub (niels-c)
      checkpoint: niels-c/resnet50_cpc_linhead/resnet50_cpc_linhead.safetensors
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/resnet50_cpc_linhead
    legal:
      license: MIT
    people:
      creators:
      - Niels C. Thiemann
    use:
      applications:
      - Comparing self-supervised and supervised models on Brain-Score
      - ImageNet-1k classification via a linear probe
      users:
      - Researchers comparing vision models with primate neural and behavioral data
    assertions:
