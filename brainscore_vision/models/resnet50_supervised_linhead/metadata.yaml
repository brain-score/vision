schema_version: '2.0'
domain: vision
models:
  resnet50_supervised_linhead:
    model:
      display_name: resnet50_supervised_linhead
      architecture:
        family: convolutional_neural_network
        description: CNN (ResNet-50), standard ResNet-50 architecture with a linear
          classification head
      parameter_count: 25600000
      parameter_count_exact: false
      trainable_layers: 'Backbone: 48 convolutional layers, 1 max-pooling layer, and
        1 average-pooling layer (plus a final fully connected classification layer).
        Head: 1 fully connected layer.'
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: Fully supervised timm backbone and fully supervised classification
          head
    training:
      process: Standard timm ResNet-50 (pretrained=True). Supervised training for
        the classification head (10 epochs).
      objective: Cross-entropy
      loss: Cross-entropy
      learning_rate: unknown + cosine LR schedule with 1 warmup epoch (min 1e-6, max
        1e-3)
      batch_size: unknown + 1024
      preprocessing: load_preprocess_images, image_size=224
    data:
      summary: ImageNet-1k
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k
        description: null
        role: training
    io:
      modality: image
      interface: RGB tensor 3x224x224 -> 1000-class logits or intermediate activations
        for Brain-Score API
      input_format: RGB tensor 3x224x224
      output_format: 1000-class logits or intermediate activations for Brain-Score
        API
    provenance:
      weights_provider: timm
      checkpoint: ResNet-50 trained with the A1 recipe.
      source_url: https://huggingface.co/timm/resnet50.a1_in1k
    legal:
      license: 'Backbone: Apache 2.0. Submission code: MIT. Linear Head: MIT.'
    people:
      creators:
      - timm team (weights)
      - Niels C. Thiemann (head)
      organizations:
      - timm
      - Friedrich-Miescher Institute for Biomedical Research
    use:
      applications:
      - Computational Neuroscience
      - NeuroAI
      - Brain-Score benchmarking
      biases:
      - inherent biases to ImageNet-1k and timm pretraining
    lineage:
      base_models:
      - identifier: resnet-50
        name: ResNet-50
        relationship: variant_of
    sources:
      proposal_977194d274e3f4ac_huggingface:
        kind: huggingface
        url: https://huggingface.co/niels-c/resnet50_supervised_linhead
