schema_version: '2.0'
domain: vision
models:
  resnet50-vicreg:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/resnet50_vicreg
        citation: Brain-Score vision plugin code, brainscore_vision/models/resnet50_vicreg
      method:
        kind: paper
        url: https://arxiv.org/abs/2105.04906
        citation: 'Bardes, Ponce & LeCun (2022), VICReg: Variance-Invariance-Covariance
          Regularization for Self-Supervised Learning, ICLR 2022'
      repo:
        kind: other
        url: https://github.com/facebookresearch/vicreg
        citation: facebookresearch/vicreg
    model:
      display_name: resnet50-vicreg
      architecture:
        family: convolutional_neural_network
        description: ResNet-50 backbone (no classification head) from torch.hub facebookresearch/vicreg:main
      parameter_count: 23508032
      parameter_count_exact: false
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: self_supervised
        description: VICReg self-supervised pretraining, no labels
    training:
      process: VICReg self-supervised pretraining of ResNet-50 on ImageNet-1k (released
        weights)
    data:
      summary: ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: pretraining
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
    provenance:
      weights_provider: Meta AI (torch.hub facebookresearch/vicreg)
      checkpoint: torch.hub facebookresearch/vicreg:main resnet50
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/resnet50_vicreg
    assertions:
