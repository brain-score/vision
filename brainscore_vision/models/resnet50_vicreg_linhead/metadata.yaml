schema_version: '2.0'
domain: vision
models:
  resnet50_vicreg_linhead:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/resnet50_vicreg_linhead
        citation: Brain-Score vision plugin code, brainscore_vision/models/resnet50_vicreg_linhead
      card:
        kind: huggingface
        url: https://huggingface.co/niels-c/resnet50_vicreg_linhead
        citation: Hugging Face model card niels-c/resnet50_vicreg_linhead
      method_paper:
        kind: paper
        url: https://arxiv.org/abs/2105.04906
        citation: 'Bardes, Ponce & LeCun (2022), VICReg: Variance-Invariance-Covariance
          Regularization for Self-Supervised Learning, ICLR 2022'
    model:
      display_name: resnet50_vicreg_linhead
      architecture:
        family: convolutional_neural_network
        description: ResNet-50 (torchvision definition) whose fc layer is a linear
          head on the 2048-d pooled features
      parameter_count: 25557032
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: self_supervised
        description: Self-supervised VICReg backbone (frozen); linear head trained
          with ImageNet-1k labels
    training:
      process: 'Backbone: VICReg self-supervised pretraining on ImageNet-1k, weights
        from facebookresearch/vicreg; kept frozen (including batch norm statistics)
        while a linear head was trained for 10 epochs on ImageNet-1k'
      loss: Cross-entropy without label smoothing (linear head only)
      learning_rate: 1e-3 peak after a 1-epoch linear warmup, cosine decay to 1e-6
        (AdamW, weight decay 0)
      batch_size: '1024'
      preprocessing: 'Linear probe: random resized crop to 224x224 (scale 0.3 to 1.0),
        random horizontal flip, ImageNet mean/std normalization'
    data:
      summary: ImageNet-1k (backbone pretraining and linear head)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: pretraining
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: fine_tuning
        description: Linear head
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits from the linear head (backbone.fc)
    provenance:
      weights_provider: Hugging Face Hub (niels-c)
      checkpoint: niels-c/resnet50_vicreg_linhead/resnet50_vicreg_linhead.safetensors
        (revision b9ed8ba78ec92c282a0b8718a1ea6e9c55468b22)
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/resnet50_vicreg_linhead
    legal:
      license: MIT
    people:
      creators:
      - 'VICReg backbone: facebookresearch/vicreg'
      - Niels C. Thiemann (linear head)
    use:
      applications:
      - Comparing self-supervised and supervised models on Brain-Score
      - ImageNet-1k classification via a linear probe
      users:
      - Researchers comparing vision models with primate neural and behavioral data
    lineage:
      base_models:
      - name: ResNet-50 VICReg (facebookresearch/vicreg)
        relationship: fine_tuned_from
