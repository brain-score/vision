    model:
      display_name: resnet50-vitoimagevidnet8
      version: 'Same checkpoint file+hash as resnet50-VITO-8deg-cc: resnet50_vito_linear_sdattn.pth
        (SHA1 2103a19...) - i.e. identical trained weights registered under a second
        identifier'
      architecture:
        family: convolutional_neural_network
        description: CNN (ResNet-50) with custom attention-pooling head; self-supervised
          VITO-pretrained features
      parameter_count: 25600000
      parameter_count_exact: false
      trainable_layers: Backbone trained during original VITO pretraining (external);
        loaded frozen (strict=False) for Brain-Score inference - no training occurs
        in this submission
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      visual_degrees: null
      visual_degrees_description: null
      supervision:
        type: self_supervised
        description: Self-supervised pretrain (VITO); linear/attention-pool readout
          on top of frozen features
    training:
      process: Custom ResNet-50 (attn_pool=True) loaded with VITO-pretrained weights
        (resnet50_vito_linear_sdattn.pth) fetched from Brain-Score's S3 storage; loaded
        with strict=False; evaluated at 224x224. Identical checkpoint to resnet50-VITO-8deg-cc,
        registered as a separate model identifier.
      objective: null
      loss: null
      learning_rate: null
      batch_size: null
      preprocessing: load_preprocess_images, image_size=224 (standard preprocessing,
        not Inception-style)
    data:
      summary: VITO self-supervised pretraining on image+video data (per arXiv:2210.06433);
        confirmed only via checkpoint filename convention, not stated in the submission
        code itself
      training_datasets:
      - identifier: vito-self-supervised-pretraining-on-imag
        name: VITO self-supervised pretraining on image+video data (per arXiv:2210.06433)
        description: null
        role: training
      - identifier: confirmed-only-via-checkpoint-filename-c
        name: confirmed only via checkpoint filename convention, not stated in the
          submission code itself
        description: null
        role: training
    io:
      modality: image
      interface: RGB tensor 3x224x224 -> intermediate activations at named layers
        (conv1/layer1-4/avgpool/avgpool2/fc) for Brain-Score API; classifier head
        not necessarily a trained ImageNet classifier given attn_pool architecture
      input_format: RGB tensor 3x224x224
      output_format: intermediate activations at named layers (conv1/layer1-4/avgpool/avgpool2/fc)
        for Brain-Score API; classifier head not necessarily a trained ImageNet classifier
        given attn_pool architecture
      tokenizer: null
    provenance:
      weights_provider: Hosted on Brain-Score's own S3 storage (brainscore-storage
        bucket); underlying VITO pretraining attributed to Parthasarathy et al. /
        Google DeepMind by naming convention, not stated in code
      checkpoint: resnet50_vito_linear_sdattn.pth, SHA1 2103a1941017fdb5f58ac77e5587e7a73cd96bd8
        (identical file to resnet50-VITO-8deg-cc)
      source_url: null
      curation_confidence: null
    legal:
      license: 'Submission code: MIT (brain-score/vision repo license); underlying
        VITO weights license unconfirmed'
    eval:
      test_datasets:
      - identifier: brain-score-neural-behavioral-benchmark
        name: Brain-Score neural/behavioral benchmark stimulus sets (confirmed via
          ModelCommitment registration and layer list)
        description: null
    use:
      applications:
      - Computational neuroscience - human-alignment / video-pretraining research
      - Brain-Score benchmarking
      biases:
      - Inherits biases of underlying VITO video/image pretraining corpus (external,
        unconfirmed exact source in this code)
      limitations:
      - Self-supervised video-pretraining objective may transfer less directly to
        static-image Brain-Score benchmarks than supervised training
      - identical checkpoint duplicated under two separate identifiers may cause confusion
      users:
      - Vision neuroscientists studying human-alignment of self-supervised models
    people:
      creators:
      - Brain-Score submitter, using a checkpoint attributed by naming convention
        to Parthasarathy et al. (Google DeepMind, VITO paper) - not stated explicitly
        in code (empty bibtex)
      organizations:
      - Brain-Score (hosting/registration, brainscore-storage S3 bucket); underlying
        pretraining likely Google DeepMind per naming convention
    lineage:
      base_models:
      - identifier: resnet-50
        name: ResNet-50
        relationship: variant_of
