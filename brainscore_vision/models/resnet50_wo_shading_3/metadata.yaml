schema_version: '2.0'
domain: vision
models:
  resnet50_wo_shading_iteration=3:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/resnet50_wo_shading_3
        citation: Brain-Score vision plugin code, brainscore_vision/models/resnet50_wo_shading_3
      kapoor2025:
        kind: other
        url: https://iclr.cc/media/iclr-2025/Slides/36853_r86bRFq.pdf
        citation: 'Kapoor & Egger (2025), ICLR 2025 workshop slides: controlled synthetic
          training data (Blender renders of ~37K object meshes, one appearance or
          rotation factor varied per dataset), alignment evaluated with Brain-Score,
          RSA and CKA'
    model:
      display_name: resnet50_wo_shading_iteration=3
      version: Dataset condition "wo_shading", iteration 3
      architecture:
        family: convolutional_neural_network
        description: ResNet-50 (torchvision resnet50 definition via torch.hub, 1000-way
          classifier); the plugin downloads the checkpoint but has no branch that
          loads it into resnet50, so the scored network keeps its random initialization
      parameter_count: 25557032
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: none
        description: Untrained (random initialization) as loaded by the plugin
    training:
      process: 'Intended checkpoint: Trained (PyTorch Lightning checkpoint) on a synthetic
        Blender-rendered object dataset, condition "wo_shading" (rendered without
        shading), iteration 3. Not loaded by the plugin: the scored ResNet-50 is randomly
        initialized.'
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way logits from the final classifier layer
    provenance:
      weights_provider: Shreya Kapoor / Bernhard Egger (eggerbernhard.ch web server)
      checkpoint: https://eggerbernhard.ch/shreya/latest_resnet50/wo_shading_3.ckpt
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/resnet50_wo_shading_3
    people:
      creators:
      - Shreya Kapoor
      - Bernhard Egger
      organizations:
      - Friedrich-Alexander-Universität Erlangen-Nürnberg
    use:
      applications:
      - Studying how rendering factors of synthetic training data affect brain alignment
      limitations:
      - 'Plugin bug: the downloaded checkpoint is never loaded, so scores reflect
        a randomly initialized ResNet-50'
    lineage:
      base_models:
      - name: ResNet-50
        relationship: variant_of
    assertions:
