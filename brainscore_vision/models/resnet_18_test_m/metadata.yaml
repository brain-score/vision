    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/resnet_18_test_m
        citation: Brain-Score vision plugin code, brainscore_vision/models/resnet_18_test_m
    model:
      display_name: resnet-18_test_m
      architecture:
        family: convolutional_neural_network
        description: ResNet-18 (code copied from torchvision) with torchvision ImageNet
          weights resnet18-f37072fd.pth
      parameter_count: 11689512
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: 1000-class ImageNet-1k classification
    training:
      process: torchvision ImageNet-1k ResNet-18 weights; test submission per identifier
    data:
      summary: ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
