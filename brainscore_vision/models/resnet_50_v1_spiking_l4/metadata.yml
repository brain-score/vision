      version: IMAGENET1K_V1
      architecture:
        family: convolutional_neural_network
        description: Torchvision ResNet-50 (IMAGENET1K_V1) with parameter-free SpikingJelly
          integrate-and-fire neurons (IFNode) inserted after each residual block of
          layer4 and after avgpool; no further training
      parameter_count: 25557032
      parameter_count_exact: true
      trainable_layers: '54'
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: 1000-class ImageNet-1k classification
    training:
      process: 'No training in the plugin: pretrained torchvision ResNet-50 with integrate-and-fire
        neurons added at inference'
    data:
      summary: ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way logits
    provenance:
