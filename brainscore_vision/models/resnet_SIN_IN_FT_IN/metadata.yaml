    model:
      display_name: resnet_SIN_IN_FT_IN
      version: Geirhos et al. 2019 model C weights
      architecture:
        family: convolutional_neural_network
        description: CNN (ResNet), texture/shape-bias supervised training
      parameter_count: 25600000
      parameter_count_exact: false
      trainable_layers: All ResNet-50 layers trainable across both training stages
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      visual_degrees: null
      visual_degrees_description: Commonly 8 degrees for Brain-Score ResNet-50 baselines
        (unconfirmed for this exact entry)
      supervision:
        type: supervised
        description: Fully supervised (1000-way classification)
    training:
      process: Standard ResNet-50 architecture trained on combined Stylized-ImageNet
        (SIN) + ImageNet (IN) for 45 epochs, then fine-tuned on ImageNet alone for
        60 epochs with LR decay after 30 epochs (Geirhos et al. 2019, model C)
      objective: Cross-entropy classification loss
      loss: Cross-entropy
      learning_rate: 0.1, multiplied by 0.1 after 20 and 40 epochs (SIN stage); fine-tune
        stage LR decay after 30 epochs
      batch_size: '256'
      preprocessing: Standard torchvision ImageNet preprocessing (resize/crop 224,
        ImageNet mean/std)
    data:
      summary: Stylized-ImageNet (SIN) + ImageNet (IN), then ImageNet fine-tune
      training_datasets:
      - identifier: stylized-imagenet-sin-imagenet-in
        name: Stylized-ImageNet (SIN) + ImageNet (IN), then ImageNet fine-tune
        description: null
        role: training
    io:
      modality: image
      interface: RGB tensor 3x224x224 -> 1000-class logits or intermediate activations
        (Brain-Score API)
      input_format: RGB tensor 3x224x224
      output_format: 1000-class logits or intermediate activations (Brain-Score API)
      tokenizer: null
    provenance:
      weights_provider: Robert Geirhos / Bethge Lab (rgeirhos/texture-vs-shape)
      checkpoint: resnet50_finetune_60_epochs_lr_decay_after_30_start_resnet50_train_45_epochs_combined_IN_SF-ca06340c.pth.tar
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/resnet_SIN_IN_FT_IN
      curation_confidence: null
    legal:
      license: null
    eval:
      test_datasets:
      - identifier: imagenet-val-geirhos-cue-conflict-shap
        name: ImageNet val + Geirhos cue-conflict shape/texture stimuli; also scored
          on Brain-Score benchmarks
        description: null
      validation_datasets:
      - identifier: imagenet-1k-standard-validation-split
        name: ImageNet-1K standard validation split
        description: null
    use:
      applications:
      - Computational neuroscience - shape/texture bias research
      - robustness studies
      - Brain-Score benchmarking
      biases:
      - Explicitly designed to reduce texture bias relative to standard ImageNet training
      - texture bias returns after IN fine-tuning
      limitations:
      - Fine-tuning on IN after SIN+IN training reduces shape bias back toward texture
        bias (per Hermann et al. 2020, arXiv:2006.09373)
      users:
      - Vision neuroscientists and robustness researchers
    people:
      creators:
      - Robert Geirhos, Patricia Rubisch, Claudio Michaelis, Matthias Bethge, Felix
        Wichmann (Bethge Lab)
      organizations:
      - University of Tuebingen / Bethge Lab
