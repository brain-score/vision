          checkpoints (MIT license)'
    model:
      display_name: resnet18_imagenet_full
      version: Final checkpoint, epoch 100
      architecture:
        family: convolutional_neural_network
        description: ResNet-18 (torchvision definition), 1000-way classifier
      parameter_count: 11689512
      parameter_count_exact: true
      trainable_layers: '21'
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: Supervised 1000-class object categorization
    training:
      process: Trained from scratch on ImageNet-1k (ILSVRC-2012) (full training set)
        for 100 epochs as part of a model/data scaling study
      loss: Cross-entropy
      learning_rate: SGD, peak 0.1 after a 5-epoch linear warm-up, momentum 0.9, weight
        decay 1e-4
      batch_size: '512'
      preprocessing: Random resized crop and horizontal flip
    data:
      summary: ImageNet-1k (ILSVRC-2012), full training set
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
        description: full training set
    io:
      modality: image
      input_format: RGB image resized to 256x256 (bilinear), center-cropped to 224x224,
