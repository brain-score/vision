schema_version: "2.0.0"
schema_url: "https://raw.githubusercontent.com/brain-score/vision/master/docs/model_metadata/model-metadata-v2.schema.json"
model:
  identifier: "convnext_base_imagenet_full_seed-0"
  display_name: "convnext_base_imagenet_full_seed-0"
  domain: "vision"
  version: "EPFL NeuroAI Scaling Variant"
architecture:
  family: "convolutional_neural_network"
  description: "ConvNeXt (pure CNN, 'ConvNet for the 2020s')"
  parameter_count:
    value: 88600000
    exact: true
  recurrent: false
lineage:
  base_models:
    -
      name: "ConvNeXt-Base (trained from scratch, not fine-tuned from another checkpoint)"
interface:
  inputs:
    -
      modality: "image"
      shape:
        channels: 3
        height: 224
        width: 224
  description: "Input: RGB image tensor (assumed 224x224x3); Output: 1000-class ImageNet logits"
training:
  process: "Standard ConvNeXt-Base trained on 100% ('full') of ImageNet-1k, with a fixed random seed (seed-0) as one run in a seeded multi-run comparison set"
  datasets:
    -
      identifier: "imagenet-1k"
      name: "ImageNet-1k"
      role: "training"
      sample_count: 1281167
      sample_unit: "images"
  supervision:
    type: "supervised"
    description: "Fully Supervised"
  objectives:
    -
      type: "classification"
      description: "Image classification (1000-way)"
  loss:
    description: "Not published (cross-entropy presumed for standard ImageNet classification)"
evaluation:
  test_datasets:
    -
      description: "ImageNet validation set (used for robustness/alignment evaluation in the source paper)"
  validation_datasets:
    -
      description: "ImageNet-1k validation set (presumed, standard practice)"
artifacts:
  -
    role: "weights"
    provider: "Brain-Score model registry (loaded via BrainScore library v2.2.4)"
  -
    role: "source_code"
    provider: "Brain-Score"
    url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/scaling_models"
    path: "brainscore_vision/models/scaling_models"
intended_use:
  applications:
    - "Used in this context as a candidate model for measuring representational alignment to biological vision and adversarial robustness"
  users:
    - "Vision neuroscience / alignment researchers (via Brain-Score)"
    - "ML robustness researchers"
references:
  -
    role: "primary"
    url: "https://arxiv.org/pdf/2411.05712"
provenance:
  sources:
    curation_workbook:
      type: "curation"
      title: "Brainscore Model Metadata.xlsx"
    implementation:
      type: "source_code"
      url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/scaling_models"
      path: "brainscore_vision/models/scaling_models"
  assertions:
    -
      path: "/model/display_name"
      status: "verified"
      source: "curation_workbook"
    -
      path: "/lineage/base_models"
      status: "verified"
      source: "curation_workbook"
    -
      path: "/model/version"
