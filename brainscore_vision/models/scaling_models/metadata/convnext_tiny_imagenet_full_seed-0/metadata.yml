schema_version: "2.0.0"
schema_url: "https://raw.githubusercontent.com/brain-score/vision/master/docs/model_metadata/model-metadata-v2.schema.json"
model:
  identifier: "convnext_tiny_imagenet_full_seed-0"
  display_name: "convnext_tiny_imagenet_full_seed-0"
  domain: "vision"
architecture:
  family: "convolutional_neural_network"
  description: "ConvNeXt (pure CNN)"
  parameter_count:
    value: 28600000
    exact: true
  recurrent: false
lineage:
  base_models:
    -
      name: "ConvNeXt-Tiny (trained from scratch, not fine-tuned)"
interface:
  inputs:
    -
      modality: "image"
      shape:
        channels: 3
        height: 224
        width: 224
  description: "Input: 224x224x3 RGB tensor (assumed); Output: 1000-class ImageNet logits"
training:
  process: "Standard ConvNeXt-Tiny trained on 100% of ImageNet-1k with a fixed random seed (seed-0), part of a seeded multi-run comparison set"
  datasets:
    -
      identifier: "imagenet-1k"
      name: "ImageNet-1k"
      role: "training"
  dataset_summary: "~1.28M images / 1000 classes (standard ImageNet-1k)"
  supervision:
    type: "supervised"
    description: "Supervised (labeled image classification)"
  objectives:
    -
      type: "classification"
      description: "Image classification (1000-way)"
evaluation:
  test_datasets:
    -
      description: "ImageNet validation set"
  validation_datasets:
    -
      description: "ImageNet-1k validation set (presumed)"
artifacts:
  -
    role: "weights"
    provider: "Brain-Score model registry (loaded via BrainScore library v2.2.4)"
  -
    role: "source_code"
    provider: "Brain-Score"
    url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/scaling_models"
    path: "brainscore_vision/models/scaling_models"
intended_use:
  applications:
    - "Candidate model for measuring representational alignment to biological vision and adversarial robustness"
  users:
    - "Vision neuroscience / alignment researchers (via Brain-Score)"
    - "ML robustness researchers"
references:
  -
    role: "primary"
    url: "https://arxiv.org/pdf/2411.05712"
provenance:
  sources:
    curation_workbook:
      type: "curation"
      title: "Brainscore Model Metadata.xlsx"
    implementation:
      type: "source_code"
      url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/scaling_models"
      path: "brainscore_vision/models/scaling_models"
  assertions:
    -
      path: "/model/display_name"
      status: "verified"
      source: "curation_workbook"
    -
      path: "/lineage/base_models"
      status: "inferred"
      source: "curation_workbook"
    -
      path: "/model/version"
      status: "undocumented"
