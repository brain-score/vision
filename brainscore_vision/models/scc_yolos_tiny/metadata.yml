schema_version: '2.0'
domain: vision
models:
  yolos_tiny:
    sources:
      legacy:
        kind: unreviewed
        citation: Existing plugin metadata; primary sources need review.
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/scc_yolos_tiny
        citation: Brain-Score vision plugin code, brainscore_vision/models/scc_yolos_tiny
      yolos:
        kind: paper
        url: https://arxiv.org/abs/2106.00666
        citation: 'Fang et al. (2021), You Only Look at One Sequence: Rethinking Transformer
          in Vision through Object Detection, NeurIPS 2021'
      card:
        kind: huggingface
        url: https://huggingface.co/hustvl/yolos-tiny
        citation: hustvl/yolos-tiny model card
    model:
      display_name: yolos_tiny
      architecture:
        family: vision_transformer
        description: 'YOLOS-Tiny: ViT-based object detector (Hugging Face YolosForObjectDetection)'
      parameter_count: 6488736
      trainable_layers: '82'
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: COCO object detection after ImageNet-1k pretraining
    training:
      process: DeiT-Tiny backbone pretrained on ImageNet-1k, fine-tuned for object
        detection on COCO 2017
    data:
      summary: ImageNet-1k (ILSVRC-2012) -> COCO 2017
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: pretraining
      - identifier: other
        name: COCO 2017
        role: fine_tuning
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
    provenance:
      weights_provider: hustvl (Hugging Face Hub)
      checkpoint: hustvl/yolos-tiny
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/scc_yolos_tiny
    legal:
