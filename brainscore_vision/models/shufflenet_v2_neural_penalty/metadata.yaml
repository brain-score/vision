schema_version: '2.0'
domain: vision
models:
  shufflenet_v2_neural_penalty:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/shufflenet_v2_neural_penalty
        citation: Brain-Score vision plugin code, brainscore_vision/models/shufflenet_v2_neural_penalty
    model:
      display_name: shufflenet_v2_neural_penalty
      architecture:
        family: convolutional_neural_network
        description: ShuffleNetV2 x1.0 (torchvision definition); weights loaded with
          strict=False
      parameter_count: 2278604
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
    training:
      process: Trained with a neural predictivity penalty (per plugin bibtex "Shufflenet
        with neural predictivity penalty"); data and recipe not documented
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way logits
    provenance:
      weights_provider: William Qian (Google Drive)
      checkpoint: https://drive.google.com/file/d/1farWpPB7Q55oUMH9oWlPL9WxWUSnxH_Y/view?usp=sharing
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/shufflenet_v2_neural_penalty
    people:
      creators:
      - William Qian
    lineage:
      base_models:
      - name: ShuffleNetV2 x1.0
        relationship: variant_of
