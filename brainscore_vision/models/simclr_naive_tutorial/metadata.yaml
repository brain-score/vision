schema_version: '2.0'
domain: vision
models:
  simclr_naive_tutorial:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/simclr_naive_tutorial
        citation: Brain-Score vision plugin code, brainscore_vision/models/simclr_naive_tutorial
      card:
        kind: huggingface
        url: https://huggingface.co/1aurent/resnet50.tcga_brca_simclr
        citation: 1aurent/resnet50.tcga_brca_simclr model card
    model:
      display_name: simclr_naive_tutorial
      architecture:
        family: convolutional_neural_network
        description: ResNet-50 (timm) from hf-hub:1aurent/resnet50.tcga_brca_simclr
      parameter_count: 23508032
      parameter_count_exact: false
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: self_supervised
        description: SimCLR on histopathology image patches
    training:
      process: SimCLR pretraining on TCGA-BRCA breast-cancer histopathology patches
        (per the checkpoint name)
    data:
      summary: TCGA-BRCA histopathology patches
      training_datasets:
      - identifier: other
        name: TCGA-BRCA histopathology patches
        role: pretraining
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
