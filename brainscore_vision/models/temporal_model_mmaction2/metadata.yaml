      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/temporal_model_mmaction2
        citation: Brain-Score vision plugin code, brainscore_vision/models/temporal_model_mmaction2
      i3d:
        kind: paper
        url: https://arxiv.org/abs/1705.07750
        citation: Carreira & Zisserman (2017), Quo Vadis, Action Recognition? A New
          Model and the Kinetics Dataset, CVPR 2017
      mmaction2:
        kind: other
        url: https://github.com/open-mmlab/mmaction2
        citation: OpenMMLab MMAction2 model zoo (Apache-2.0)
      mmaction2_table:
        kind: other
        citation: mmaction2.csv bundled with the plugin (MMAction2 model zoo figures)
    model:
      display_name: I3D
      architecture:
        family: convolutional_neural_network
        description: 'I3D: ResNet-50 inflated to 3D (MMAction2)'
      parameter_count: 28000000
      parameter_count_exact: false
      recurrent: false
      supervision:
        type: supervised
        description: Supervised Kinetics-400 action classification after supervised
          ImageNet pretraining
    training:
      process: MMAction2 recipe i3d_imagenet-pretrained-r50_8xb8-32x2x1-100e_kinetics400-rgb
    data:
      summary: ImageNet-1k (ILSVRC-2012) -> Kinetics-400
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: pretraining
      - identifier: other
        name: Kinetics-400
        role: fine_tuning
    io:
      modality: video
      input_format: RGB video clip sampled at 12.5 fps
      output_format: 400-way Kinetics-400 logits
    provenance:
      weights_provider: OpenMMLab MMAction2 model zoo
