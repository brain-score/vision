schema_version: '2.0'
domain: vision
models:
  ConvLSTM:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/temporal_model_openstl
        citation: Brain-Score vision plugin code, brainscore_vision/models/temporal_model_openstl
      convlstm:
        kind: paper
        url: https://arxiv.org/abs/1506.04214
        citation: Shi et al. (2015), Convolutional LSTM Network, NeurIPS 2015
      openstl:
        kind: other
        url: https://github.com/chengtan9907/OpenSTL
        citation: OpenSTL benchmark and released KITTI-Caltech weights (Tan et al.
          2023, NeurIPS Datasets and Benchmarks)
    model:
      display_name: ConvLSTM
      architecture:
        family: recurrent_convolutional_neural_network
        description: 'ConvLSTM: stacked convolutional LSTM cells (OpenSTL implementation)'
      recurrent: true
      input_resolution:
        channels: 3
        height: 128
        width: 160
      supervision:
        type: self_supervised
        description: 'Video prediction: future frames are predicted from past frames
          (no labels)'
    training:
      process: Trained for 100 epochs on KITTI to predict future frames (OpenSTL KITTI-Caltech
        setting, 128x160)
    data:
      summary: KITTI
      training_datasets:
      - identifier: other
        name: KITTI (raw driving videos)
        role: training
    io:
      modality: video
      input_format: RGB video clip sampled at 10 fps
      output_format: Predicted future frames
    provenance:
      weights_provider: OpenSTL GitHub release
      checkpoint: https://github.com/chengtan9907/OpenSTL/releases/download/kitti-weights/kitticaltech_convlstm_one_ep100.pth
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/temporal_model_openstl
    legal:
      license: Apache-2.0
