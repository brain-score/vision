schema_version: "2.0.0"
schema_url: "https://raw.githubusercontent.com/brain-score/vision/master/docs/model_metadata/model-metadata-v2.schema.json"
model:
  identifier: "convnext_tiny:in12k_ft_in1k"
  display_name: "convnext_tiny.in12k_ft_in1k"
  domain: "vision"
  version: "timm library release (part of pytorch-image-models)"
  aliases:
    - "convnext_tiny.in12k_ft_in1k"
architecture:
  family: "convolutional_neural_network"
  description: "ConvNeXt (pure CNN)"
  parameter_count:
    value: 28600000
    exact: true
  trainable_layers:
    description: "Full model (all layers trainable during fine-tune)"
  recurrent: false
lineage:
  base_models:
    -
      identifier: "convnext-tiny"
      name: "ConvNeXt-Tiny"
      relationship: "fine_tuned_from"
interface:
  inputs:
    -
      modality: "image"
      shape:
        channels: 3
        height: 288
        width: 288
  description: "Input: 288x288x3 RGB tensor (test); Output: 1000-class logits, or feature maps/embeddings depending on mode"
preprocessing:
  description: "Resolved via timm.data.resolve_model_data_config(); resize/crop to 288x288 test resolution + normalization"
training:
  process: "Pretrained on ImageNet-12k (11,821-class subset of ImageNet-22k) on TPUs (Google TRC program), then fine-tuned on ImageNet-1k on 8x GPU Lambda Labs cloud instances"
  datasets:
    -
      identifier: "imagenet-12k"
      name: "ImageNet-12k"
      role: "pretraining"
    -
      identifier: "imagenet-1k"
      name: "ImageNet-1k"
      role: "fine_tuning"
  dataset_summary: "ImageNet-12k = 11,821 classes (subset of ImageNet-22k); ImageNet-1k = ~1.28M images/1000 classes"
  supervision:
    type: "supervised"
    description: "Supervised (labeled image classification)"
  objectives:
    -
      type: "classification"
      description: "Image classification, two-stage (12k-class pretrain, then 1k-class fine-tune)"
evaluation:
  test_datasets:
    -
      description: "ImageNet-1k validation set"
  validation_datasets:
    -
      description: "ImageNet-1k validation set"
artifacts:
  -
    role: "weights"
    provider: "timm (Ross Wightman) / Hugging Face timm org"
    identifier: "Hugging Face repo: timm/convnext_tiny.in12k_ft_in1k (safetensors)"
  -
    role: "source_code"
    provider: "Brain-Score"
    url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/timm_models"
    path: "brainscore_vision/models/timm_models"
intended_use:
  applications:
    - "Image classification, feature/embedding extraction, backbone for downstream vision tasks"
  users:
    - "ML engineers/researchers needing an efficient ImageNet classifier or feature extractor"
authorship:
  creators:
    - "Ross Wightman"
  organizations:
    - "Hugging Face (timm maintainer org)"
licenses:
  -
    scope: "unspecified"
    name: "Apache-2.0"
    spdx: "Apache-2.0"
provenance:
  sources:
    curation_workbook:
      type: "curation"
      title: "Brainscore Model Metadata.xlsx"
    implementation:
      type: "source_code"
      url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/timm_models"
      path: "brainscore_vision/models/timm_models"
