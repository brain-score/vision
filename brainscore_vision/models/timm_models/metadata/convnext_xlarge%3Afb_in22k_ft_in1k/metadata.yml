schema_version: "2.0.0"
schema_url: "https://raw.githubusercontent.com/brain-score/vision/master/docs/model_metadata/model-metadata-v2.schema.json"
model:
  identifier: "convnext_xlarge:fb_in22k_ft_in1k"
  display_name: "convnext_xlarge.fb_in22k_ft_in1k"
  domain: "vision"
  version: "timm library release"
  aliases:
    - "convnext_xlarge.fb_in22k_ft_in1k"
architecture:
  family: "convolutional_neural_network"
  description: "ConvNeXt (pure CNN)"
  parameter_count:
    value: 350200000
    exact: true
  trainable_layers:
    description: "Full model"
  recurrent: false
lineage:
  base_models:
    -
      name: "ConvNeXt-XLarge pretrained on ImageNet-22k by the original ConvNeXt paper authors, fine-tuned on ImageNet-1k"
interface:
  inputs:
    -
      modality: "image"
      shape:
        channels: 3
        height: 288
        width: 288
  description: "Input: 288x288x3 RGB tensor (test); Output: 1000-class logits, or feature maps/embeddings depending on mode"
preprocessing:
  description: "Resolved via timm.data.resolve_model_data_config(); resize/crop to 288x288 test resolution + normalization"
training:
  process: "Pretrained on full ImageNet-22k, then fine-tuned on ImageNet-1k, by the original Facebook/Meta ConvNeXt paper authors (not a timm-community fine-tune)"
  datasets:
    -
      identifier: "imagenet-22k"
      name: "ImageNet-22k"
      role: "pretraining"
    -
      identifier: "imagenet-1k"
      name: "ImageNet-1k"
      role: "fine_tuning"
  dataset_summary: "ImageNet-22k (~14M images, ~21,841 classes, standard full release); ImageNet-1k ~1.28M images/1000 classes"
  supervision:
    type: "supervised"
    description: "Supervised (labeled image classification)"
  objectives:
    -
      type: "classification"
      description: "Two-stage image classification (22k-class pretrain, then 1k-class fine-tune)"
evaluation:
  test_datasets:
    -
      description: "ImageNet-1k validation set"
  validation_datasets:
    -
      description: "ImageNet-1k validation set"
artifacts:
  -
    role: "weights"
    provider: "Original ConvNeXt paper authors (Facebook/Meta AI), distributed via timm / Hugging Face"
    identifier: "Hugging Face repo: timm/convnext_xlarge.fb_in22k_ft_in1k (safetensors); original source: facebookresearch/ConvNeXt"
  -
    role: "source_code"
    provider: "Brain-Score"
    url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/timm_models"
    path: "brainscore_vision/models/timm_models"
intended_use:
  applications:
    - "Image classification, feature/embedding extraction, high-capacity backbone for downstream vision tasks"
  users:
    - "ML engineers/researchers needing a very high-capacity ImageNet classifier or feature extractor"
authorship:
  creators:
    - "Original ConvNeXt paper authors (Liu, Mao, Wu, Feichtenhofer, Darrell, Xie)"
    - "HF/timm distribution by Ross Wightman"
  organizations:
    - "Facebook AI Research / Meta AI (original weights)"
    - "Hugging Face (timm distribution)"
licenses:
  -
    scope: "unspecified"
    name: "Apache-2.0"
    spdx: "Apache-2.0"
provenance:
  sources:
    curation_workbook:
      type: "curation"
      title: "Brainscore Model Metadata.xlsx"
    implementation:
      type: "source_code"
      url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/timm_models"
      path: "brainscore_vision/models/timm_models"
  assertions:
    -
      path: "/model/display_name"
      status: "verified"
      source: "curation_workbook"
    -
      path: "/lineage/base_models"
      status: "verified"
