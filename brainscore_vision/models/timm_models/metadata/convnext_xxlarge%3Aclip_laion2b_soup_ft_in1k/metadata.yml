schema_version: "2.0.0"
schema_url: "https://raw.githubusercontent.com/brain-score/vision/master/docs/model_metadata/model-metadata-v2.schema.json"
model:
  identifier: "convnext_xxlarge:clip_laion2b_soup_ft_in1k"
  display_name: "convnext_xxlarge.clip_laion2b_soup_ft_in1k"
  domain: "vision"
  version: "timm library release"
  aliases:
    - "convnext_xxlarge.clip_laion2b_soup_ft_in1k"
architecture:
  family: "convolutional_neural_network"
  description: "ConvNeXt (pure CNN)"
  parameter_count:
    value: 845500000
    exact: true
  trainable_layers:
    description: "Full model"
  recurrent: false
lineage:
  base_models:
    -
      identifier: "clip-convnext-xxlarge"
      name: "CLIP ConvNeXt-XXLarge"
      relationship: "fine_tuned_from"
interface:
  inputs:
    -
      modality: "image"
      shape:
        channels: 3
        height: 256
        width: 256
  description: "Input: 256x256x3 RGB tensor; Output: 1000-class logits, or feature maps/embeddings depending on mode"
preprocessing:
  description: "Resolved via timm.data.resolve_model_data_config(); resize/crop to 256x256 + normalization"
training:
  process: "CLIP image tower pretrained via OpenCLIP contrastive image-text training on LAION-2B; multiple pretrain checkpoints combined via 'model soup' (weight averaging); fine-tuned on ImageNet-1k in timm"
  datasets:
    -
      identifier: "laion-2b"
      name: "LAION-2B"
      role: "pretraining"
    -
      identifier: "imagenet-1k"
      name: "ImageNet-1k"
      role: "fine_tuning"
  dataset_summary: "LAION-2B (~2 billion image-text pairs, per LAION-5B paper); ImageNet-1k ~1.28M images/1000 classes"
  supervision:
    type: "mixed"
    description: "Contrastive (CLIP) pretraining + supervised fine-tuning"
  objectives:
    -
      type: "contrastive"
      description: "Image-text contrastive pretraining, then image classification fine-tuning"
    -
      type: "classification"
      description: "Image-text contrastive pretraining, then image classification fine-tuning"
evaluation:
  test_datasets:
    -
      description: "ImageNet-1k validation set"
  validation_datasets:
    -
      description: "ImageNet-1k validation set"
artifacts:
  -
    role: "weights"
    provider: "timm (Ross Wightman) / OpenCLIP (mlfoundations) / LAION"
    identifier: "Hugging Face repo: timm/convnext_xxlarge.clip_laion2b_soup_ft_in1k (safetensors)"
  -
    role: "source_code"
    provider: "Brain-Score"
    url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/timm_models"
    path: "brainscore_vision/models/timm_models"
intended_use:
  applications:
    - "High-accuracy image classification, feature/embedding extraction, backbone for downstream vision or multimodal tasks"
  users:
    - "ML engineers/researchers needing maximum accuracy at the cost of very large model size/compute"
  limitations:
    - "Very large parameter count and compute cost (198.09 GMACs) relative to accuracy gains over smaller variants"
authorship:
  creators:
    - "Ross Wightman (timm fine-tune)"
    - "OpenCLIP team (Ilharco, Wortsman, Wightman, Gordon, Carlini, Taori, Dave, Shankar, Namkoong, Miller, Hajishirzi, Farhadi, Schmidt) for CLIP pretraining"
    - "LAION for the LAION-2B dataset"
  organizations:
    - "Hugging Face (timm) / OpenCLIP (mlfoundations) / LAION"
licenses:
  -
    scope: "unspecified"
    name: "Apache-2.0"
    spdx: "Apache-2.0"
