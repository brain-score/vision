schema_version: "2.0.0"
schema_url: "https://raw.githubusercontent.com/brain-score/vision/master/docs/model_metadata/model-metadata-v2.schema.json"
model:
  identifier: "vit_large_patch14_clip_224:laion2b_ft_in12k_in1k"
  display_name: "vit_large_patch14_clip_224:laion2b_ft_in12k_in1k"
  domain: "vision"
  version: "OpenCLIP LAION-2B ViT-L/14 checkpoint, timm two-stage fine-tune at 224px"
architecture:
  family: "vision_transformer"
  description: "Vision Transformer (ViT-L/14), CLIP image encoder"
  parameter_count:
    value: 304200000
    exact: false
  trainable_layers:
    description: "24 transformer blocks; full fine-tune assumed"
  recurrent: false
lineage:
  base_models:
    -
      identifier: "openclip-vit-l14-laion2b"
      name: "OpenCLIP ViT-L/14 (LAION-2B)"
      relationship: "fine_tuned_from"
interface:
  inputs:
    -
      modality: "image"
      shape:
        channels: 3
        height: 224
        width: 224
  description: "Input: RGB (B,3,224,224); Output: 1000-way logits or (B,257,1024) unpooled tokens / pooled embedding"
preprocessing:
  description: "224x224, crop_pct 1.0, bicubic; OpenCLIP LAION normalization stats"
training:
  process: "OpenCLIP contrastive pretrain on LAION-2B -> supervised fine-tune on ImageNet-12k -> further fine-tune on ImageNet-1k"
  datasets:
    -
      identifier: "laion-2b"
      name: "LAION-2B"
      role: "pretraining"
    -
      identifier: "imagenet-12k"
      name: "ImageNet-12k"
      role: "fine_tuning"
    -
      identifier: "imagenet-1k"
      name: "ImageNet-1k"
      role: "fine_tuning"
  dataset_summary: "LAION-2B-en = 2.3B pairs; ImageNet-12k >=400 img/class min. (exact total unconfirmed); ImageNet-1k = 1.28M/50K"
  supervision:
    type: "mixed"
    description: "Contrastive pretrain + two-stage supervised fine-tune"
  objectives:
    -
      type: "contrastive"
      description: "Contrastive InfoNCE (pretrain) + classification loss(es) (both fine-tune stages)"
    -
      type: "classification"
      description: "Contrastive InfoNCE (pretrain) + classification loss(es) (both fine-tune stages)"
  loss:
    description: "Contrastive (pretrain) + cross-entropy classification (both fine-tune stages, inferred)"
evaluation:
  test_datasets:
    -
      description: "ImageNet-1k val - top-1 87.90%, top-5 98.41% (best LAION-based 224px variant per results-imagenet.csv)"
  validation_datasets:
    -
      description: "ImageNet-12k val split (40/class) mid-training; ImageNet-1k val for final metric"
artifacts:
  -
    role: "weights"
    provider: "Hugging Face Hub, timm org"
    identifier: "timm/vit_large_patch14_clip_224.laion2b_ft_in12k_in1k"
  -
    role: "source_code"
    provider: "Brain-Score"
    url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/timm_models"
    path: "brainscore_vision/models/timm_models"
intended_use:
  applications:
    - "ImageNet-1k classification"
    - "best-performing LAION-based 224px backbone/embeddings in this family"
  users:
    - "Researchers/practitioners wanting best LAION-pretrained 224px accuracy in this family"
  limitations:
    - "Same LAION-2B uncurated-data caveats"
    - "still trails OpenAI-pretrained 224px equivalent (88.16% vs 87.90% top-1)"
  biases:
    - "Same LAION-5B documented content-safety/demographic caveats"
authorship:
  creators:
    - "LAION/mlfoundations OpenCLIP team (base)"
    - "Ross Wightman (fine-tune)"
  organizations:
    - "LAION (dataset/training collaboration)"
    - "Ross Wightman/timm (fine-tune/hosting)"
licenses:
  -
    scope: "unspecified"
    name: "Apache-2.0 (HF tag); LAION-2B metadata CC-BY 4.0"
    spdx: "Apache-2.0"
provenance:
  sources:
    curation_workbook:
      type: "curation"
      title: "Brainscore Model Metadata.xlsx"
    implementation:
      type: "source_code"
      url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/timm_models"
      path: "brainscore_vision/models/timm_models"
