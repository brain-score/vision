schema_version: "2.0.0"
schema_url: "https://raw.githubusercontent.com/brain-score/vision/master/docs/model_metadata/model-metadata-v2.schema.json"
model:
  identifier: "vit_large_patch14_clip_224:openai_ft_in1k"
  display_name: "vit_large_patch14_clip_224:openai_ft_in1k"
  domain: "vision"
  version: "Original OpenAI CLIP ViT-L/14 (224px), released January 2022"
architecture:
  family: "vision_transformer"
  description: "Vision Transformer (ViT-L/14), CLIP image encoder"
  parameter_count:
    value: 304200000
    exact: false
  trainable_layers:
    description: "24 transformer blocks; full fine-tune assumed"
  recurrent: false
lineage:
  base_models:
    -
      identifier: "openai-clip-vit-l14"
      name: "OpenAI CLIP ViT-L/14"
      relationship: "fine_tuned_from"
interface:
  inputs:
    -
      modality: "image"
      shape:
        channels: 3
        height: 224
        width: 224
  description: "Input: RGB (B,3,224,224); Output: 1000-way logits or (B,257,1024) unpooled tokens / pooled embedding"
preprocessing:
  description: "224x224, crop_pct 1.0, bicubic; OpenAI CLIP normalization stats"
training:
  process: "CLIP contrastive pretrain on WIT-400M -> direct supervised fine-tune on ImageNet-1k (no IN-12k stage)"
  datasets:
    -
      identifier: "wit-400m"
      name: "WIT-400M"
      role: "pretraining"
    -
      identifier: "imagenet-1k"
      name: "ImageNet-1k"
      role: "fine_tuning"
  dataset_summary: "WIT-400M ~400M pairs; ImageNet-1k 1.28M train/50K val"
  supervision:
    type: "mixed"
    description: "Contrastive pretrain + supervised fine-tune"
  objectives:
    -
      type: "contrastive"
      description: "CLIP contrastive loss + classification loss (fine-tune)"
    -
      type: "classification"
      description: "CLIP contrastive loss + classification loss (fine-tune)"
  loss:
    description: "Contrastive (pretrain) + cross-entropy (fine-tune, inferred)"
evaluation:
  test_datasets:
    -
      description: "ImageNet-1k val - top-1 87.86%, top-5 98.43% (results-imagenet.csv)"
  validation_datasets:
    -
      description: "ImageNet-1k val"
artifacts:
  -
    role: "weights"
    provider: "Hugging Face Hub, timm org"
    identifier: "timm/vit_large_patch14_clip_224.openai_ft_in1k"
  -
    role: "source_code"
    provider: "Brain-Score"
    url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/timm_models"
    path: "brainscore_vision/models/timm_models"
intended_use:
  applications:
    - "ImageNet classification"
    - "transfer-learning backbone/embeddings, lower-compute 224px option"
  users:
    - "CV researchers/engineers needing compact (224px, lower-compute) ViT-L classifier"
  limitations:
    - "Same CLIP-inherited weaknesses (fine-grained classification, counting)"
    - "slightly lower top-1 than IN12k->IN1k variant (87.86% vs 88.16%)"
  biases:
    - "Same FairFace-documented racial/gender disparities & WIT-400M demographic skew as OpenAI CLIP model card"
authorship:
  creators:
    - "OpenAI (base CLIP)"
    - "Ross Wightman (fine-tune)"
  organizations:
    - "OpenAI (base pretrain)"
    - "Ross Wightman/timm (fine-tune, hosting)"
licenses:
  -
    scope: "unspecified"
    name: "Apache-2.0 (HF tag), same OpenAI MIT-code / research-intent nuance"
    spdx: "Apache-2.0"
provenance:
  sources:
    curation_workbook:
      type: "curation"
      title: "Brainscore Model Metadata.xlsx"
    implementation:
      type: "source_code"
      url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/timm_models"
      path: "brainscore_vision/models/timm_models"
