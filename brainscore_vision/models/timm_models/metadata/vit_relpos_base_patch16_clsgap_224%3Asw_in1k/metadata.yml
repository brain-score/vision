schema_version: "2.0.0"
schema_url: "https://raw.githubusercontent.com/brain-score/vision/master/docs/model_metadata/model-metadata-v2.schema.json"
model:
  identifier: "vit_relpos_base_patch16_clsgap_224:sw_in1k"
  display_name: "vit_relpos_base_patch16_clsgap_224:sw_in1k"
  domain: "vision"
  version: "Base, patch16, 224px, class token retained alongside GAP head ('clsgap')"
architecture:
  family: "vision_transformer"
  description: "ViT w/ relative log-coord position embeddings, standard pre-norm blocks (RelPosBlock), class token + GAP combined"
  parameter_count:
    value: 86400000
    exact: false
  trainable_layers:
    description: "12 blocks (RelPosBlock), 12 attention heads"
  recurrent: false
lineage:
  base_models:
    -
      name: "Vision Transformer, relative-position variant"
interface:
  inputs:
    -
      modality: "image"
      shape:
        channels: 3
        height: 224
        width: 224
  description: "Input: RGB tensor 3x224x224; Output: 1000-class logits or (1,197,768) unpooled tokens (196 patches + 1 class token)"
preprocessing:
  description: "crop_pct~0.9, bicubic interpolation, normalize mean=std=(0.5,0.5,0.5)"
training:
  process: "Single-stage supervised training from scratch on ImageNet-1k using timm's 'sw' (Swin-derived) recipe"
  datasets:
    -
      identifier: "imagenet-1k"
      name: "ImageNet-1k"
      role: "training"
  dataset_summary: "ImageNet-1k: 1.28M train / 50K val images, 1000 classes"
  supervision:
    type: "supervised"
    description: "Fully supervised classification"
  objectives:
    -
      type: "classification"
      description: "1000-way classification via cross-entropy"
  hyperparameters:
    learning_rate:
      description: "Not publicly documented (cosine schedule with warmup per recipe)"
  loss:
    description: "Cross-entropy, likely with label smoothing (inferred)"
evaluation:
  test_datasets:
    -
      description: "ImageNet-1k validation set"
  validation_datasets:
    -
      description: "ImageNet-1k validation set"
artifacts:
  -
    role: "weights"
    provider: "Ross Wightman / timm"
    identifier: "vit_relpos_base_patch16_gapcls_224-sw-1a341d6c.pth (note: filename order 'gapcls' vs published ID 'clsgap')"
  -
    role: "source_code"
    provider: "Brain-Score"
    url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/timm_models"
    path: "brainscore_vision/models/timm_models"
intended_use:
  applications:
    - "ImageNet classification"
    - "transfer-learning backbone"
    - "research on class-token vs GAP pooling design"
  users:
    - "CV researchers studying pooling strategy / relative position bias"
    - "timm/HF users"
  limitations:
    - "Author-documented config flaw: class token enabled but GAP+fc-norm NOT disabled, described as \"a bit of a mistake\" in timm source, kept only for future-retrain comparisons"
  biases:
    - "Inherits ImageNet-1k dataset biases (category imbalance, geographic/demographic skew)"
authorship:
  creators:
    - "Ross Wightman"
  organizations:
    - "timm / Hugging Face"
licenses:
  -
    scope: "unspecified"
    name: "Apache-2.0"
    spdx: "Apache-2.0"
provenance:
  sources:
    curation_workbook:
      type: "curation"
      title: "Brainscore Model Metadata.xlsx"
    implementation:
      type: "source_code"
      url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/timm_models"
      path: "brainscore_vision/models/timm_models"
