    curation_workbook:
      type: "curation"
      title: "Brainscore Model Metadata.xlsx"
    implementation:
      type: "source_code"
      url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/timm_models"
      path: "brainscore_vision/models/timm_models"
