schema_version: '2.0'
domain: vision
models:
  vgg_16_altahan_02:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/vgg_16_altahan_02
        citation: Brain-Score vision plugin code, brainscore_vision/models/vgg_16_altahan_02
    model:
      display_name: vgg_16_altahan_02
      architecture:
        family: convolutional_neural_network
        description: 'VGG-16 (torchvision): torchvision''s ImageNet-pretrained VGG-16
          (no batch norm), unmodified, read out with Brain-Score''s committed ''vgg_16''
          layer map.'
      parameter_count: 138357544
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: Supervised ImageNet-1k classification (torchvision weights, unmodified)
    training:
      process: The weights are torchvision's IMAGENET1K_V1 (downloaded by torchvision;
        no upload). V1, V2 and V4 read pool3 (features.16), IT reads pool4 (features.23),
        and behaviour reads fc7 (classifier.3, the last listed layer); 8 degrees,
        224 px. Brain-Score's default `logits` layer is classifier.6, the output of
        forward().
    data:
      summary: ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: torchvision (PyTorch)
      checkpoint: torchvision vgg16 IMAGENET1K_V1
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/vgg_16_altahan_02
