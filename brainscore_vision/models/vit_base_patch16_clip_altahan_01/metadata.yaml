schema_version: '2.0'
domain: vision
models:
  vit_base_patch16_clip_altahan_01:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/vit_base_patch16_clip_altahan_01
        citation: Brain-Score vision plugin code, brainscore_vision/models/vit_base_patch16_clip_altahan_01
    model:
      display_name: vit_base_patch16_clip_altahan_01
      architecture:
        family: vision_transformer
        description: 'ViT-B/16 CLIP image tower (timm vit_base_patch16_clip_224):
          ViT-B/16 CLIP with local response normalisation on the patch embedding,
          fine-tuned on ImageNet with a SimCLR auxiliary and framed, edge-map and
          wide-crop training views; V1, V2 and V4 read from an anti-aliased patch
          embedding, IT averaged over half-patch image shifts, behaviour from centred,
          L2-normalised logits.'
      parameter_count: 86568424
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: contrastive_pretrain_supervised_finetune
        description: CLIP pretraining, supervised ImageNet fine-tuning with a SimCLR
          auxiliary loss
    training:
      process: 'timm `vit_base_patch16_clip_224.openai_ft_in12k_in1k` (the CLIP ViT-B/16
        image tower, fine-tuned by timm on ImageNet-12k then ImageNet-1k), with a
        parameter-free local response normalisation (size 5, alpha 1e-4, beta 0.75,
        k 2) across the 768 channels of the patch-embedding output (in place of its
        identity `patch_embed.norm`). Fine-tuned further on ImageNet-1k: AdamW, lr
        1e-5, weight decay 0.05, batch 256, 2.56M images; cross-entropy plus a SimCLR
        NT-Xent auxiliary loss (weight 0.5, temperature 0.2) on the 768-d pre-logits
        through a projection head that is discarded after training. Training views:
        random-resized-crop with area scale 0.35-1 and horizontal flip; for the cross-entropy
        input, 10% of the images are replaced by their Sobel edge map, and 80% are
        then shrunk by a factor U[0.35, 1] and pasted centred on a uniform grey canvas
        of random level; the SimCLR views are unframed. The LRN has no weights, so
        the state dict is timm''s.'
    data:
      summary: WIT-400M (OpenAI WebImageText) -> ImageNet-12k (timm 11,821-class subset)
        -> ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: wit-400m
        name: WIT-400M (OpenAI WebImageText)
        role: pretraining
      - identifier: imagenet-12k
        name: ImageNet-12k (timm 11,821-class subset)
        role: fine_tuning
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: fine_tuning
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: Brain-Score submitter upload (user_873)
      checkpoint: s3://brainscore-storage/brainscore-vision/models/user_873/vit_base_patch16_clip_altahan_01.pt
        (version V___E8lZoBREyvCr7TRCE0tyYeoq9krz)
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/vit_base_patch16_clip_altahan_01
