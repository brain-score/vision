schema_version: '2.0'
domain: vision
models:
  vit_large_clip336_openai:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/vit_large_clip336_openai
        citation: Brain-Score vision plugin code, brainscore_vision/models/vit_large_clip336_openai
      vit:
        kind: paper
        url: https://arxiv.org/abs/2010.11929
        citation: 'Dosovitskiy et al. (2021), An Image is Worth 16x16 Words: Transformers
          for Image Recognition at Scale, ICLR 2021'
      clip:
        kind: paper
        url: https://arxiv.org/abs/2103.00020
        citation: Radford et al. (2021), Learning Transferable Visual Models From
          Natural Language Supervision, ICML 2021
      timm_card:
        kind: huggingface
        url: https://huggingface.co/timm/vit_large_patch14_clip_336.openai_ft_in12k_in1k
        citation: timm model card vit_large_patch14_clip_336.openai_ft_in12k_in1k
    model:
      display_name: vit_large_clip336_openai
      version: timm vit_large_patch14_clip_336.openai_ft_in12k_in1k
      architecture:
        family: vision_transformer
        description: vit_large_patch14_clip_336 (timm)
      parameter_count: 304532456
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 336
        width: 336
      supervision:
        type: contrastive_pretrain_supervised_finetune
        description: CLIP image-text contrastive pretraining, then supervised fine-tuning
    training:
      process: OpenAI CLIP image tower pretrained with an image-text contrastive objective,
        then fine-tuned in timm on ImageNet-12k and then ImageNet-1k
    data:
      summary: WIT-400M (OpenAI WebImageText) -> ImageNet-12k (timm 11,821-class subset)
        -> ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: wit-400m
        name: WIT-400M (OpenAI WebImageText)
        role: pretraining
      - identifier: imagenet-12k
        name: ImageNet-12k (timm 11,821-class subset)
        role: fine_tuning
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: fine_tuning
    io:
      modality: image
      input_format: RGB image resized to 336x336 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: 'timm / Hugging Face Hub: OpenAI CLIP pretraining; timm (Ross
        Wightman) fine-tuning'
      checkpoint: timm/vit_large_patch14_clip_336.openai_ft_in12k_in1k
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/vit_large_clip336_openai
    legal:
      license: Apache-2.0
    use:
      applications:
      - Image classification
      - Backbone for downstream vision tasks
