schema_version: '2.0'
domain: vision
models:
  vith14_untrained_linhead:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/vith14_untrained_linhead
        citation: Brain-Score vision plugin code, brainscore_vision/models/vith14_untrained_linhead
      card:
        kind: huggingface
        url: https://huggingface.co/niels-c/vith14_untrained_linhead
        citation: Hugging Face model card niels-c/vith14_untrained_linhead
    model:
      display_name: vith14_untrained_linhead
      architecture:
        family: vision_transformer
        description: Untrained ViT-H/14 with the I-JEPA architecture (facebook/ijepa_vith14_1k
          config) and a linear head
      parameter_count: 632043240
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: none
        description: Untrained backbone (random initialization); only the linear head
          is trained with labels
    training:
      process: Randomly initialized ViT-H/14 kept frozen while a linear head was trained
        for 10 epochs on ImageNet-1k
      loss: Cross-entropy without label smoothing (linear head only)
      learning_rate: 1e-3 peak after a 1-epoch linear warmup, cosine decay to 1e-6
        (AdamW, weight decay 0)
      batch_size: '1024'
      preprocessing: 'Linear probe: random resized crop to 224x224 (scale 0.3 to 1.0),
        random horizontal flip, ImageNet mean/std normalization'
    data:
      summary: ImageNet-1k (linear head)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: fine_tuning
        description: Linear head
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way ImageNet-1k logits from the linear head (backbone.fc)
    provenance:
      weights_provider: Hugging Face Hub (niels-c)
      checkpoint: niels-c/vith14_untrained_linhead/vith14_untrained_linhead.safetensors
        (revision 11a552a822cce283537351d091130152261c7d59)
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/vith14_untrained_linhead
    legal:
      license: MIT
    people:
      creators:
      - Niels C. Thiemann
    use:
      applications:
      - Comparing self-supervised and supervised models on Brain-Score
      - ImageNet-1k classification via a linear probe
      users:
      - Researchers comparing vision models with primate neural and behavioral data
