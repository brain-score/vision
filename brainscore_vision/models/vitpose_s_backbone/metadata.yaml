schema_version: '2.0'
domain: vision
models:
  vitpose_s_backbone:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/vitpose_s_backbone
        citation: Brain-Score vision plugin code, brainscore_vision/models/vitpose_s_backbone
    model:
      display_name: vitpose_s_backbone
      architecture:
        family: vision_transformer
        description: ViT-S/16 (timm vit_small_patch16_224, ImageNet weights) used
          as a stand-in for the ViTPose-S backbone; no pose weights are loaded
      parameter_count: 21665664
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: timm ImageNet weights of vit_small_patch16_224
    training:
      process: timm vit_small_patch16_224 pretrained weights; despite the identifier,
        no ViTPose weights are loaded
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: Token features (no head)
    provenance:
      weights_provider: timm (Hugging Face Hub)
      checkpoint: timm vit_small_patch16_224 (pretrained=True)
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/vitpose_s_backbone
    assertions:
    - path: /model/display_name
      status: probable
      sources:
      - plugin_code
    - path: /model/architecture/family
      status: probable
      sources:
      - plugin_code
    - path: /model/architecture/description
      status: probable
      sources:
      - plugin_code
    - path: /model/parameter_count
      status: probable
      sources:
      - plugin_code
    - path: /model/parameter_count_exact
      status: probable
      sources:
      - plugin_code
    - path: /model/recurrent
      status: probable
      sources:
      - plugin_code
    - path: /model/input_resolution/channels
      status: probable
      sources:
      - plugin_code
    - path: /model/input_resolution/height
      status: probable
      sources:
      - plugin_code
    - path: /model/input_resolution/width
      status: probable
      sources:
      - plugin_code
    - path: /model/supervision/type
      status: probable
      sources:
      - plugin_code
    - path: /model/supervision/description
      status: probable
      sources:
      - plugin_code
    - path: /training/process
      status: probable
