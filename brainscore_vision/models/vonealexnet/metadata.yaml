schema_version: '2.0'
domain: vision
models:
  vonealexnet:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/vonealexnet
        citation: Brain-Score vision plugin code, brainscore_vision/models/vonealexnet
      dapello2020:
        kind: paper
        url: https://doi.org/10.1101/2020.06.16.154542
        citation: Dapello, Marques, Schrimpf, Geiger, Cox & DiCarlo (2020), Simulating
          a Primary Visual Cortex at the Front of CNNs Improves Robustness to Image
          Perturbations, NeurIPS 2020
      vonenet_repo:
        kind: other
        url: https://github.com/dicarlolab/vonenet
        citation: dicarlolab/vonenet repository
    model:
      display_name: VOneAlexNet
      architecture:
        family: hybrid_biological_convolutional
        description: VOneBlock (fixed Gabor filter bank with simple/complex cells)
          followed by an AlexNet back-end; the plugin disables the VOneBlock stochasticity
          (noise mode None)
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: ImageNet-1k classification with a fixed V1-like VOneBlock front-end
    training:
      process: Back-end trained on ImageNet-1k with the fixed VOneBlock front-end
        (published VOneAlexNet weights)
    data:
      summary: ImageNet-1k
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224, normalized with mean = std = 0.5
      output_format: 1000-way ImageNet-1k logits
    provenance:
      weights_provider: DiCarlo lab (vonenet package, dicarlolab/vonenet)
      checkpoint: vonenet.get_model('alexnet') pretrained weights
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/vonealexnet
    people:
      creators:
      - Joel Dapello
      - Tiago Marques
      - Martin Schrimpf
      - Franziska Geiger
      - David D. Cox
      - James J. DiCarlo
      organizations:
      - Massachusetts Institute of Technology
      - MIT-IBM Watson AI Lab
    use:
      applications:
      - Robustness to image perturbations
      - Modeling primate V1
    assertions:
    - path: /model/display_name
      status: probable
      sources:
      - plugin_code
    - path: /model/architecture/family
      status: probable
      sources:
      - plugin_code
    - path: /model/architecture/description
      status: probable
      sources:
      - plugin_code
    - path: /model/recurrent
      status: probable
      sources:
