schema_version: '2.0'
domain: vision
models:
  voneresnet_50_no_weight:
    sources:
      legacy:
        kind: unreviewed
        citation: Existing plugin metadata; primary sources need review.
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/voneresnet_50_no_weight
        citation: Brain-Score vision plugin code, brainscore_vision/models/voneresnet_50_no_weight
      piper2024:
        kind: paper
        url: https://arxiv.org/abs/2409.16838
        citation: Piper, Oliveira & Marques (2024), Explicitly Modeling Pre-Cortical
          Vision with a Neuro-Inspired Front-End Improves CNN Robustness, arXiv:2409.16838
    model:
      display_name: voneresnet_50_no_weight
      architecture:
        family: hybrid_biological_convolutional
        description: 'VOneNet-style: neuro-inspired front-end VOneBlock (fixed Gabor
          filter bank, gabor_seed=1) followed by a ResNet-50 back-end (EVNet code
          bundled with the plugin)'
      parameter_count: 27500264
      parameter_count_exact: true
      trainable_layers: '54'
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: none
        description: 'No trained weights: fixed (non-trainable) front-end filters
          and a randomly initialized back-end'
    training:
      process: 'Not trained: the plugin builds the network and loads no checkpoint'
    io:
      modality: image
      input_format: RGB image resized to 224x224, scaled to [0, 1] without mean/std
        normalization
      output_format: 1000-way logits
    provenance:
      weights_provider: 'None: no trained weights are loaded'
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/voneresnet_50_no_weight
    people:
      creators:
      - Lucas Piper
      - Arlindo L. Oliveira
      - Tiago Marques
    use:
      applications:
      - Modeling early (subcortical and V1) visual processing
      - Robustness to image perturbations
      limitations:
      - Scored without trained weights (random back-end initialization)
