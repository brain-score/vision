schema_version: "2.0.0"
schema_url: "https://raw.githubusercontent.com/brain-score/vision/master/docs/model_metadata/model-metadata-v2.schema.json"
model:
  identifier: "voneresnet-50-non_stochastic"
  display_name: "voneresnet-50-non_stochastic"
  domain: "vision"
  version: "v0.1 weights release (Jun 30, 2020)"
architecture:
  family: "hybrid_biological_convolutional"
  description: "Biologically-fixed V1 front-end + CNN (ResNet) back-end"
  parameter_count:
    value: 25600000
    exact: false
  trainable_layers:
    description: "All ResNet-50 conv/BN/FC layers trainable; VOneBlock Gabor filters fixed"
  recurrent: false
lineage:
  base_models:
    -
      name: "ResNet-50"
interface:
  inputs:
    -
      modality: "image"
      shape:
        channels: 3
        height: 224
        width: 224
  description: "RGB tensor 3x224x224 -> 1000-class logits or intermediate activations (Brain-Score API)"
preprocessing:
  description: "Normalize mean=[0.5,0.5,0.5], std=[0.5,0.5,0.5]"
training:
  process: "Gabor filter bank (fixed) -> simple/complex-cell nonlinearity -> noise generator disabled -> bottleneck -> ResNet-50 stages 1-4 -> classifier"
  datasets:
    -
      identifier: "imagenet-1k"
      name: "ImageNet-1k"
      role: "training"
  dataset_summary: "~1.28M train / 50K val images (ImageNet-1K)"
  supervision:
    type: "supervised"
    description: "Fully supervised (1000-way classification)"
  objectives:
    -
      type: "classification"
      description: "Cross-entropy classification loss on ImageNet labels"
  hyperparameters:
    learning_rate:
      description: "Not publicly specified"
    batch_size:
      description: "Not publicly specified"
  loss:
    description: "Cross-entropy"
evaluation:
  test_datasets:
    -
      description: "ImageNet val (50K) + Brain-Score benchmark stimulus sets"
  validation_datasets:
    -
      description: "ImageNet-1K standard validation split"
artifacts:
  -
    role: "weights"
    provider: "DiCarlo Lab (github.com/dicarlolab/vonenet); S3-hosted"
    identifier: "Epoch-70 checkpoint, noise generator disabled at inference"
  -
    role: "source_code"
    provider: "Brain-Score"
    url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/voneresnet_50_non_stochastic"
    path: "brainscore_vision/models/voneresnet_50_non_stochastic"
intended_use:
  applications:
    - "Computational neuroscience (V1 modeling), adversarial robustness research, Brain-Score benchmarking"
  users:
    - "Vision neuroscientists, ML robustness researchers"
  limitations:
    - "Clean accuracy/robustness trade off with V1 channel count"
    - "lacks noise-driven robustness gains"
  biases:
    - "Inherits ImageNet dataset biases (object-centric, Western-centric sourcing)"
authorship:
  creators:
    - "Dapello, Marques, Schrimpf, Geiger, Cox, DiCarlo"
  organizations:
    - "MIT DiCarlo Lab"
licenses:
  -
    scope: "unspecified"
    name: "GNU GPL v3+"
provenance:
  sources:
    curation_workbook:
      type: "curation"
      title: "Brainscore Model Metadata.xlsx"
    implementation:
      type: "source_code"
      url: "https://github.com/brain-score/vision/tree/master/brainscore_vision/models/voneresnet_50_non_stochastic"
      path: "brainscore_vision/models/voneresnet_50_non_stochastic"
