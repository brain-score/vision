schema_version: '2.0'
domain: vision
models:
  xception:
    sources:
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/xception
        citation: Brain-Score vision plugin code, brainscore_vision/models/xception
      xception:
        kind: paper
        url: https://arxiv.org/abs/1610.02357
        citation: 'Chollet (2017), Xception: Deep Learning with Depthwise Separable
          Convolutions, CVPR 2017'
      timm:
        kind: huggingface
        url: https://huggingface.co/timm
        citation: timm (PyTorch Image Models) model cards on Hugging Face
    model:
      display_name: Xception
      version: legacy_xception.tf_in1k
      architecture:
        family: convolutional_neural_network
        description: 'Xception (timm ''xception'', now legacy_xception: port of the
          Keras/TensorFlow weights)'
      parameter_count: 22855952
      parameter_count_exact: true
      recurrent: false
      input_resolution:
        channels: 3
        height: 299
        width: 299
      supervision:
        type: supervised
        description: 1000-class ImageNet-1k classification
    data:
      summary: ImageNet-1k (ILSVRC-2012)
      training_datasets:
      - identifier: imagenet-1k
        name: ImageNet-1k (ILSVRC-2012)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 299x299 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 1000-way logits
    provenance:
      weights_provider: timm (Hugging Face Hub, timm organization)
      checkpoint: timm/legacy_xception.tf_in1k
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/xception
    legal:
      license: Apache-2.0
    people:
      creators:
      - François Chollet
      organizations:
      - Google
    use:
      applications:
      - Image classification
      - Feature extraction / backbone for vision tasks
    assertions:
    - path: /model/display_name
      status: probable
      sources:
      - xception
      - plugin_code
    - path: /model/version
      status: probable
      sources:
      - plugin_code
    - path: /model/architecture/family
      status: probable
      sources:
      - plugin_code
    - path: /model/architecture/description
      status: probable
      sources:
      - plugin_code
    - path: /model/parameter_count
      status: probable
      sources:
      - plugin_code
    - path: /model/parameter_count_exact
      status: probable
      sources:
