schema_version: '2.0'
domain: vision
models:
  yudixie_resnet50_object_class_0_240908:
    sources:
      legacy:
        kind: unreviewed
        citation: Existing plugin metadata; primary sources need review.
      plugin_code:
        kind: other
        url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/yudixie_resnet50_250117_8
        citation: Brain-Score vision plugin code, brainscore_vision/models/yudixie_resnet50_250117_8
      xie2025:
        kind: paper
        url: https://arxiv.org/abs/2412.09115
        citation: Xie, Huang, Alter, Schwartz, Tenenbaum & DiCarlo (2025), Vision
          CNNs trained to estimate spatial latents learned similar ventral-stream-aligned
          representations, ICLR 2025
    model:
      display_name: yudixie_resnet50_object_class_0_240908
      architecture:
        family: convolutional_neural_network
        description: ResNet-50 (torchvision resnet50 definition) with a 674-way fc
          layer
      parameter_count: 24889058
      parameter_count_exact: true
      trainable_layers: '54'
      recurrent: false
      input_resolution:
        channels: 3
        height: 224
        width: 224
      supervision:
        type: supervised
        description: Supervised estimation of object identity (548 classes, cross-entropy)
    training:
      process: 'Trained from scratch on ThreeDWorld renders (one object with random
        position and pose on a random background) to estimate object identity (548
        classes, cross-entropy); output head: 674 outputs = 9 spatial latents (distance,
        x/y translation, sin/cos of three rotation angles) + 117 object categories
        + 548 object identities, of which only the trained targets are used'
      objective: Estimate object identity (548 classes, cross-entropy) from the image
      loss: Cross-entropy for category and identity, square loss for continuous latents;
        arithmetic mean over tasks
      learning_rate: 0.001 (Adam)
      batch_size: '64'
    data:
      summary: ThreeDWorld synthetic object images
      training_datasets:
      - identifier: other
        name: ThreeDWorld (TDW) synthetic object images (117 categories, 548 object
          models)
        role: training
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 674-dimensional output of the fc layer
    provenance:
      weights_provider: Yudi Xie (S3 bucket yudi-brainscore-models)
      checkpoint: https://yudi-brainscore-models.s3.amazonaws.com/yudixie_resnet50_object_class_0_240908.pth
      source_url: https://github.com/brain-score/vision/tree/master/brainscore_vision/models/yudixie_resnet50_250117_8
    people:
      creators:
      - Yudi Xie
      - Weichen Huang
      - Esther Alter
      - Jeremy Schwartz
      - Joshua B. Tenenbaum
      - James J. DiCarlo
      organizations:
      - Massachusetts Institute of Technology (DiCarlo lab)
    use:
      applications:
      - Testing whether spatial-latent estimation yields ventral-stream-aligned representations
    lineage:
      base_models:
      - name: ResNet-50
        relationship: variant_of
