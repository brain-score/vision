      process: Run of an object-class scaling experiment with a 10-way output head
        (per plugin name); training data not documented in the plugin
    io:
      modality: image
      input_format: RGB image resized to 224x224 and normalized with ImageNet mean/std
        (Brain-Score load_preprocess_images)
      output_format: 10-dimensional output of the fc layer
